<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kuppel Live-Viewer</title>
<style>
  :root { --bg:#0f1720; --panel:#17212c; --line:#2a3846; --text:#e6edf3; --muted:#9fb0c0; --accent:#4cc38a; --hover:#ffc247; --sel:#4de1ff; }
  * { box-sizing: border-box; }
  .statik .nur-live { display:none !important; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:13px/1.4 system-ui, sans-serif; overflow:hidden; }
  #view { position:fixed; inset:0; }
  #panel { position:fixed; top:10px; left:10px; width:330px; max-height:calc(100% - 20px); overflow:auto; background:var(--panel);
           border:1px solid var(--line); border-radius:8px; padding:10px; }
  #panel h1 { font-size:14px; margin:0 0 6px; }
  #status { color:var(--muted); font-size:12px; margin-bottom:8px; }
  #status b { color:var(--accent); font-weight:600; }
  #lade { margin:0 0 8px; padding:7px 8px; border:1px solid var(--line); border-radius:6px; background:#121b25; }
  #lade[hidden] { display:none; }
  #ladephase { font-size:12px; font-weight:600; margin-bottom:5px; }
  #lade .bar { height:8px; border-radius:4px; background:#223142; overflow:hidden; }
  #lade .bar i { display:block; height:100%; width:0; background:var(--sel); transition:width .15s; }
  #lade.fertig .bar i { background:var(--accent); }
  #lade.abbruch .bar, #lade.abbruch #ladephase, #lade.abbruch #ladetext { display:none; }
  #ladetext { font-size:12px; color:var(--muted); margin-top:5px; word-break:break-word; font-variant-numeric:tabular-nums; }
  #ladewarn { margin-top:5px; padding:4px 6px; border-radius:4px; background:#3a3320; border:1px solid var(--hover); font-size:12px; }
  #ladewarn::before { content:'Hinweis: '; font-weight:600; }
  #ladefehler { margin:5px 0 0; padding:0 0 0 16px; font-size:12px; color:#ff9b8a; word-break:break-word; }
  #ladefehler:empty { display:none; }
  #variantenetikett { position:fixed; top:10px; left:50%; transform:translateX(-50%); z-index:5; padding:3px 12px; border-radius:999px; background:#16384a; border:1px solid var(--sel); font-size:12px; font-weight:600; pointer-events:none; }
  body.fpv #variantenetikett, body.detail #variantenetikett { display:none; }
  .seg { display:flex; align-items:center; gap:4px; margin:6px 0; }
  .seg > span { color:var(--muted); font-size:12px; margin-right:2px; }
  .seg button[aria-pressed=true] { background:#16384a; border-color:var(--sel); }
  #legende { font-size:12px; margin:4px 0 6px; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:#121b25; }
  #legende[hidden] { display:none; }
  #legende .lz { display:flex; align-items:center; gap:6px; padding:1px 0; }
  #legende .lz.sub { margin-left:16px; color:var(--muted); }
  #legende .kopf { color:var(--muted); margin-bottom:3px; }
  .row { display:flex; flex-wrap:wrap; gap:4px; margin:6px 0; }
  button { background:#223142; color:var(--text); border:1px solid var(--line); border-radius:5px; padding:4px 8px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--accent); }
  label.opt { display:flex; align-items:center; gap:6px; padding:1px 0; cursor:pointer; }
  #kreisinfo { font-size:12px; color:var(--muted); margin:2px 0 4px; }
  #kreisinfo:empty { display:none; }
  .sw { width:10px; height:10px; border-radius:2px; border:1px solid #0006; flex:none; }
  input[type=range] { width:100%; }
  h2 { font-size:12px; margin:10px 0 4px; color:var(--muted); font-weight:600; }
  /* Bauteilbaum */
  #tree { font-size:12.5px; user-select:none; }
  .node { display:flex; align-items:center; gap:5px; padding:2px 4px; border-radius:4px; cursor:default; }
  .node:hover { background:#22303f; }
  .node.hov { background:#3a3320; outline:1px solid var(--hover); }
  .node.sel { background:#16384a; outline:1px solid var(--sel); }
  .node .chev { width:12px; text-align:center; color:var(--muted); cursor:pointer; flex:none; }
  .node .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .node .cnt { color:var(--muted); font-variant-numeric:tabular-nums; flex:none; }
  .node input { margin:0; flex:none; }
  .lvl1 { margin-left:14px; } .lvl2 { margin-left:28px; }
  .cat > .node { font-weight:600; }
  .kids { display:none; } .open > .kids { display:block; }
  #sel { min-height:18px; color:var(--sel); font-size:12px; margin:4px 0; }
  #infopanel { position:fixed; top:10px; right:10px; width:410px; max-height:calc(100% - 20px); overflow:auto; background:var(--panel);
               border:1px solid var(--line); border-radius:8px; padding:12px 14px; font-size:12.5px; line-height:1.5; z-index:5; }
  #info h3 { margin:0 0 2px; font-size:15px; color:var(--text); }
  #info .sub { color:var(--muted); margin-bottom:6px; }
  #info .badges { display:flex; flex-wrap:wrap; gap:5px; margin:4px 0 8px; }
  #info .badge { background:#223142; border:1px solid var(--line); border-radius:10px; padding:1px 8px; font-size:11.5px; color:var(--text); }
  #info .badge.cnt { background:#1b3a2d; border-color:#2f6b4f; color:#9be0bf; }
  #info .k { color:var(--accent); font-weight:600; margin:9px 0 3px; font-size:12px; text-transform:uppercase; letter-spacing:.03em; }
  #info ol, #info ul { margin:2px 0 0; padding-left:18px; } #info li { margin:1px 0; }
  #info .g { color:var(--muted); font-weight:600; margin-top:4px; }
  #info table.kv { width:100%; border-collapse:collapse; } #info .kv td { padding:2px 4px; border-bottom:1px solid #1f2c39; vertical-align:top; }
  #info .kv td:first-child { color:var(--muted); width:42%; }
  #info .note { background:#2a2616; border-left:3px solid #d9c35b; padding:5px 8px; margin-top:8px; color:#e8d98a; }
  #info .src { color:var(--muted); font-size:11px; margin-top:8px; }
  #info .ph { color:var(--muted); }
  #fpvx { position:fixed; top:10px; right:10px; z-index:20; display:none; font-size:16px; padding:6px 14px; }
  body.fpv #panel, body.fpv #infopanel { display:none; } body.fpv #fpvx { display:block; }
  /* Detailansicht: Kontextmenue, Teileliste (ersetzt links das Bedienfeld), Schieber */
  #ctxmenu { position:fixed; z-index:30; display:none; min-width:190px; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:4px; box-shadow:0 4px 14px #0008; }
  #ctxmenu .hd { color:var(--muted); font-size:11.5px; padding:3px 8px; }
  #ctxmenu button { display:block; width:100%; text-align:left; border-color:transparent; background:none; padding:5px 8px; }
  #ctxmenu button:hover { background:#22303f; border-color:var(--accent); }
  #toast { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:40; display:none; max-width:560px; background:#2a2616; border:1px solid #d9c35b; color:#e8d98a; border-radius:6px; padding:8px 12px; }
  #detailpanel { position:fixed; top:10px; left:10px; width:330px; max-height:calc(100% - 20px); overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px; z-index:6; display:none; }
  body.detail #detailpanel { display:block; } body.detail #panel { display:none; }
  #detailpanel h1 { font-size:14px; margin:8px 0 2px; } #detailpanel .sub { color:var(--muted); font-size:12px; }
  #detailpanel .scale { display:flex; justify-content:space-between; color:var(--muted); font-size:11.5px; }
  #dlist { font-size:12.5px; user-select:none; }
  #dlist .nm { flex:1; min-width:0; } #dlist .n1, #dlist .n2 { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #dlist .n2 { color:var(--muted); font-size:11px; }
  #dlist .cat > .node { font-weight:600; } #dlist .node { align-items:flex-start; }
  #dlist .node .chev, #dlist .node .sw { margin-top:3px; }
  /* ---- Mobilansicht (N-VIEWER-MOBIL): alles unter .mobil, Desktop bleibt unberuehrt ---- */
  #mbtn, #mjoy, #mnote { display:none; }
  .mobil body { touch-action:none; -webkit-user-select:none; user-select:none; }
  .mobil #mbtn { display:block; position:fixed; top:10px; left:10px; z-index:12; min-height:44px; padding:8px 16px; font-size:15px; font-weight:600; border-radius:22px; background:var(--panel); }
  .mobil body.fpv #mbtn { display:none; }
  .mobil #panel { display:none; top:64px; left:10px; width:min(88vw, 340px); max-height:calc(100% - 74px); font-size:14px; z-index:11; touch-action:pan-y; overscroll-behavior:contain; }
  .mobil body.menue-offen #panel { display:block; }
  .mobil body.fpv #panel, .mobil body.detail #panel { display:none; }
  .mobil #panel h1 { display:none; }
  .mobil #panel button { min-height:42px; padding:8px 12px; }
  .mobil #panel label.opt { min-height:38px; }
  .mobil #panel input[type=checkbox] { width:20px; height:20px; }
  .mobil #panel input[type=range] { height:34px; }
  .mobil #panel .mnicht { display:none !important; }
  .mobil #variantenetikett { display:none; }
  .mobil #infopanel, .mobil #ctxmenu, .mobil #detailpanel { display:none !important; }
  .mobil #lade { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); width:min(92vw, 380px); z-index:15; margin:0; background:var(--panel); }
  .mobil body.fpv #lade { bottom:auto; top:10px; }
  .mobil #mnote { display:block; color:var(--muted); font-size:12px; margin:0 0 4px 28px; }
  .mobil #fpvx { top:10px; right:10px; min-width:56px; min-height:48px; font-size:20px; }
  .mobil body.fpv #mjoy { display:block; }
  #mjoy { position:fixed; left:22px; bottom:26px; width:140px; height:140px; border-radius:50%; background:#17212ccc; border:2px solid var(--line); z-index:14; touch-action:none; }
  #mjoy i { position:absolute; left:50%; top:50%; width:60px; height:60px; margin:-30px 0 0 -30px; border-radius:50%; background:#4cc38acc; border:2px solid #e6edf3aa; pointer-events:none; }
  #mjoy::after { content:'Laufen'; position:absolute; left:0; right:0; top:-22px; text-align:center; color:var(--muted); font-size:12px; pointer-events:none; }
</style>
<script>
// Statischer Modus (N-VIEWER-HOSTING): scripts/viewer_dist.py schreibt <meta name="viewer-modus" content="statisch"> in dist/index.html.
// Dann gibt es kein /api/*, keinen Export und kein Board; .obj kommt als .obj.gz (im Browser entpackt), Varianten-Dateien liegen unter festen Namen.
(function () {
  const m = document.querySelector('meta[name="viewer-modus"][content="statisch"]');
  window.STATIK = !!m; if (!m) return;
  document.documentElement.classList.add('statik');
  const orig = window.fetch.bind(window);
  const MAP = { 'system-specs.json': { ring_b2: 'system-specs-ring_b2.json' }, 'stueckliste.json': { ring_b2: 'stueckliste-ring_b2.json' } };
  window.fetch = async function (url, opt) {
    const [p0, q = ''] = String(url).split('?'); let p = p0.replace(/^\//, '');
    if (/^api\//.test(p)) return new Response('{}', { status: 404 });
    if (MAP[p]) p = MAP[p][new URLSearchParams(q).get('variante')] || p;
    if (/\.obj$/.test(p)) {
      const r = await orig(p + '.gz', opt); if (!r.ok || !r.body) return r;
      return new Response(r.body.pipeThrough(new DecompressionStream('gzip')), { status: 200, headers: { 'Content-Type': 'text/plain' } });
    }
    return orig(p, opt);
  };
})();
</script>
<script>
// Mobilansicht (N-VIEWER-MOBIL): nur Touch-Geraet UND schmale Seite (kleinere Fensterseite <= 600 px). Ohne die Klasse "mobil" gilt keine Mobil-Regel.
// Touch erkannt an Beruehrungspunkten, grobem Zeiger oder mobiler Browser-Kennung. Mit ?mobil=1 erzwingbar, mit ?mobil=0 abschaltbar.
(function () { try {
  const q = new URLSearchParams(location.search).get('mobil');
  const touch = navigator.maxTouchPoints > 0 || matchMedia('(pointer: coarse)').matches || /Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent);
  if (q === '1' || (q !== '0' && touch && Math.min(innerWidth, innerHeight) <= 600)) document.documentElement.classList.add('mobil');
} catch (e) {} })();
</script>

{ "imports": { "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<body>
<div id="view"></div>
<div id="variantenetikett"></div>
<button id="fpvx" title="FPV beenden (Esc)">X</button>
<div id="ctxmenu"></div><div id="toast"></div>
<div id="detailpanel"></div>
<div id="infopanel"><div id="info"></div></div>
<div id="panel">
  <h1>Kuppel Live-Viewer</h1>
  <div id="status">verbinde ...</div>
  <div class="seg" id="variante" role="group" aria-label="Kreislauf"><span>Kreislauf:</span>
    <button type="button" data-variante="a_plus" aria-pressed="true" title="Kreislauf A+ (heutiges Modell)">A+</button>
    <button type="button" data-variante="ring_b2" aria-pressed="false" title="Kreislauf Ring B2 (Variante, eigener Export)">Ring B2</button>
  </div>
  <div id="lade" hidden aria-live="polite">
    <div id="ladephase"></div>
    <div class="bar"><i id="ladebalken"></i></div>
    <div id="ladetext"></div>
    <div id="ladewarn" hidden></div>
    <ul id="ladefehler"></ul>
  </div>
  <div class="row">
    <button data-cam="iso">Ansicht ref-4</button><button data-cam="top">Oben</button>
    <button data-cam="side">Seite</button><button data-cam="pool">Pool</button><button id="fpv">FPV</button> <a href="/history/" target="_blank" class="nur-live" style="color:inherit">Bildverlauf</a>
  </div>
  <div class="seg" id="ansicht" role="group" aria-label="Ansicht"><span>Ansicht:</span>
    <button type="button" data-ansicht="visuell" aria-pressed="true" title="Nach Werkstoff gefärbt, mit Menschfiguren">Visuell</button>
    <button type="button" data-ansicht="technisch" aria-pressed="false" title="Nach Bauteilgruppe gefärbt, ohne Menschfiguren">Technisch</button>
  </div>
  <div id="legende" hidden></div>
  <label class="opt"><input type="checkbox" id="wire"> Drahtgitter</label>
  <label class="opt" title="Markiert alle Halter und Sonden des Messstellenplans im Modell mit rosa Kugeln"><input type="checkbox" id="mess"> Messstellen zeigen</label>
  <div id="kreise" role="group" aria-label="Kreisläufe hervorheben">
    <label class="opt" title="Hebt Wasserleitungen und alle Teile im Wasserweg blau hervor, alles andere wird blass"><input type="checkbox" id="kr_wasser"> <span class="sw" style="background:#2f8cff"></span> Wasserkreislauf</label>
    <label class="opt" title="Hebt Luftschläuche, Verteiler, Belüfter und das Gebläse hellgelb hervor, alles andere wird blass"><input type="checkbox" id="kr_luft"> <span class="sw" style="background:#ffe873"></span> Luftkreislauf</label>
    <label class="opt" title="Hebt Schaltschrank, Kabel und alle Teile am Strom orangerot hervor, alles andere wird blass"><input type="checkbox" id="kr_strom"> <span class="sw" style="background:#ff5a2e"></span> Stromkreislauf</label>
    <div id="kreisinfo"></div>
  </div>
  <label class="opt" title="Blendet die Plane (Hülle) aus"><input type="checkbox" id="plane" checked> Plane zeigen</label>
  <div class="row" style="align-items:center;flex-wrap:nowrap"><span style="color:var(--muted);font-size:12px;white-space:nowrap">Deckkraft Plane</span><input type="range" id="planeop" min="0" max="60" value="14" style="flex:1"><span id="planeopzahl" style="font-size:12px;min-width:34px;text-align:right"></span></div>
  <label class="opt nur-live"><input type="checkbox" id="auto" checked> Auto-Update</label>
  <label class="opt" title="Schrauben, Scharniere, Klinken und andere Körper unter 15 cm Diagonale; werden erst beim Einschalten nachgeladen. Stutzen, Muffen und Hähne bleiben immer sichtbar."><input type="checkbox" id="klein"> Kleinteile unter 15 cm zeigen</label>
  <h2>Schnitt (Hoehe)</h2>
  <input type="range" id="clip" min="0" max="7000" value="7000">
  <h2>Bauteile (Hover leuchtet, Klick waehlt)</h2>
  <div class="row"><button id="expandAll">Alle auf</button><button id="collapseAll">Alle zu</button><button id="showAll">Alle zeigen</button><button id="clearSel">Auswahl weg</button></div>
  <div id="sel"></div>
  <div class="row"><button id="detailbtn" hidden>Detailansicht</button></div>
  <div id="tree"></div>
  <div id="perf" style="color:var(--muted);font-size:11px;margin-top:6px"></div>
  <h2 class="nur-live">Bauteil-Stand (Board)</h2>
  <div id="board" class="nur-live" style="font-size:12px"></div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

const MOBIL = document.documentElement.classList.contains('mobil');   // Touch-Geraet mit schmaler Seite (siehe Kopf)
const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.localClippingEnabled = true;
view.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f1720);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 100, 400000);
camera.up.set(0, 0, 1);                       // Z ist oben, Masse in mm
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.3));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(-8000, -12000, 16000); scene.add(sun);

const CAMS = {
  iso:  { pos: [0, -19000, 11000], target: [0, 0, 2200] },
  top:  { pos: [0, -1, 26000],      target: [0, 0, 0] },
  side: { pos: [0, -26000, 3200],   target: [0, 0, 3000] },
  pool: { pos: [3500, -5500, 3200], target: [0, 0, 300] },
};
function setCam(k) { const c = CAMS[k]; camera.position.set(...c.pos); controls.target.set(...c.target); controls.update(); }
setCam('iso');

const clipPlane = new THREE.Plane(new THREE.Vector3(0, 0, -1), 7000);
const mats = new Map();
function matFor(color, opacity) {
  const key = color + '|' + opacity;
  if (!mats.has(key)) mats.set(key, new THREE.MeshStandardMaterial({
    color, flatShading: true, side: THREE.DoubleSide, roughness: 0.65, metalness: 0.1,
    transparent: opacity < 1, opacity, clippingPlanes: [clipPlane], depthWrite: opacity >= 1 }));
  return mats.get(key);
}
// Leucht-Materialien: zeichnen ueber allem (depthTest aus), schimmern also durch andere Koerper
const hlMat = { hover: null, sel: null };
for (const [k, col] of [['hover', 0xffc247], ['sel', 0x4de1ff]]) {
  hlMat[k] = new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.7, depthTest: false, depthWrite: false, side: THREE.DoubleSide, clippingPlanes: [clipPlane] });
}

let model = null, extras = {}, version = -1, instAnzahl = 0;   // instAnzahl: Instanzen der geladenen Variante (Kopfzeile)
const loader = new OBJLoader();
const defCache = new Map();                                 // Definitionsname -> Text: unveraenderte Definitionen werden nicht neu geladen
const hlGroup = new THREE.Group(); hlGroup.renderOrder = 999; scene.add(hlGroup);

// ---- Bauteilbaum: Kategorie -> Gruppe -> Einzelteil -----------------------------------------------------------
const CATS = [
  ['Kuppel-Struktur', /^(strebe|knoten|fundamentanker|fundamentring)/],
  ['Beete (Substrat)', /^ibc_beet/],
  ['NFT-Systeme', /^(nft_|winkelhalter)/],
  ['Tanks und Pumpen', /^(tank_|pumpe)/],
  ['Rohre und Schlaeuche', /^(lt_|zulaufrohr|rohr|schlauch)/],
  ['Pflanzen', /^(netztopf|salatkopf)/],
  ['Becken und Gelaende', /^(pool|zweitbecken|erdflaeche)/],
  ['Tuer', /^tuer/],
  ['Huelle (Plane)', /^huelle/],
  ['Technik', /^schaltschrank/],
  ['Messstellen', /^(halter_|sonde_)/],
];
const catOf = stem => (CATS.find(c => c[1].test(stem)) || ['Sonstiges'])[0];
const leafKeyOf = stem => stem.replace(/_(n|r|t)\d+$/, '');   // Varianten (knoten_4_n17, nft_rinne_x_r3) zu einer Gruppe
const pretty = s => s.replace(/_/g, ' ').replace(/^\w/, c => c.toUpperCase());
const DEFCOL = [[/^tank_/, '#93b49a'], [/^pumpe_/, '#2a5da8'], [/^ibc_beet/, '#c9ccc4'], [/^nft_tisch/, '#9aa6b2'], [/^strebe/, '#b9c0c8']];
const baseName = n => n.replace(/ \(.*$/, '');            // Koerpernamen: "T1_Strebe_A", "Wanne (2)"
function colorFor(name, def) {
  const base = baseName(name);
  if (/^huelle/i.test(def)) return matFor('#d6ecff', 0.14);   // Plane (PE doppelt) ist durchsichtig, auch im FPV
  const c = extras.colors && (extras.colors[base] || extras.colors[Object.keys(extras.colors).find(k => k.replace(/_\d+$/, '') === base.replace(/_\d+$/, ''))]);
  if (c) return matFor(c[0], c[1]);
  const P = [[/^T5_Wasser|^T6_Wasser/, '#3c8ed0', 0.85], [/^T13_/, '#8a6f4d', 1], [/^T1_/, '#b9c0c8', 1], [/^T3_/, '#cfcfca', 1],
             [/^T4_/, '#1c1c1c', 1], [/^T5_|^T6_|^T7_/, '#93b49a', 1], [/^T8_/, '#f3f3f1', 1], [/^T9_/, '#ffffff', 1],

function buildTree(inst) {

    const L = leaves.get(lk); L.stems.push(stem); L.count += defList[stem].length; stemLeaf[stem] = lk;

  });
  leaves.forEach(L => { const C = cats.get(L.cat); if (!C.leaves.includes(L.key)) C.leaves.push(L.key); C.count += L.count; });
  const box = document.getElementById('tree'), keep = document.getElementById('panel').scrollTop; box.innerHTML = '';

  [...cats.keys()].sort((a, b) => order.indexOf(a) - order.indexOf(b)).forEach(ck => {
    const C = cats.get(ck), el = document.createElement('div'); el.className = 'cat'; el.dataset.key = 'cat:' + ck;

      <div class="badges"><span class="badge cnt">${teilWort(P.teile.length)}</span><span class="badge">${detail.bodies.length} Körper</span></div>
      <div>${kt(P.kurz || '')}</div>` + bauteilPreis(true) + (klartext(P.hinweis || '') ? `<div class="note"><b>Hinweis:</b> ${kt(P.hinweis)}</div>` : '') +
      `<div class="src">Klicke ein Teil in der Liste oder im Modell an: dann steht hier seine Infokarte. Der Schieber zieht das Bauteil auseinander.</div>`; return;
  }
  const gram = detail.bodies.filter(x => x.part.id === t.id).reduce((a, x) => a + (x.b.masse_g || 0), 0);
  const kg = gram >= 1000 ? fm(gram / 1000, 2) + ' kg' : fm(gram, 0) + ' g';
  const kon = (w, k) => w ? esc(String(w).replace(/^\w/, c => c.toUpperCase())) + (k ? ` <span class="ph">(${esc(k)})</span>` : '') : '';
  const ke = katEntry(t.katalog);
  const rows = [['Werkstoff', esc(werkstoffName(t.werkstoff))], ['Maße', masseText(t.masse_mm)], ['Masse im Modell', t.menge > 1 ? `${kg} (${t.menge} Stück zusammen)` : kg],
    ['Norm', klartext(t.norm || '') ? kt(t.norm) + (t.norm_konfidenz ? ` <span class="ph">(${esc(t.norm_konfidenz)})</span>` : '') : 'keine'],
    ['Lebensmittelkontakt', kon(t.lebensmittelkontakt, t.lebensmittelkontakt_konfidenz)], ['Belegstand', esc(t.konfidenz || '')],
    ['Katalogeintrag', ke ? bez(ke.name) : ''], ['Bezug in Europa', kt(t.bezug || '')]].filter(r => r[1]);
  const pz = teilPreis(t);
  box.innerHTML = `<h3>${esc(t.name)}</h3><div class="sub">Ein ${esc(TYP[t.typ] || t.typ)}, ${t.menge} Stück im Bauteil.</div>
    <div class="badges"><span class="badge cnt">${esc(TYP[t.typ] || t.typ)}</span><span class="badge">${t.menge} ×</span><span class="badge">${esc(t.konfidenz || '')}</span></div>
    <div class="k">Funktion</div><div>${kt(t.funktion || '')}</div>
    <div class="k">Werkstoff, Maße, Norm</div><table class="kv">${rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>` + (pz ? `<div class="k">Einkauf</div><table class="kv">${pz.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>` : '') +
    (t.eigenschaften && t.eigenschaften.length ? `<div class="k">Eigenschaften</div>${bullets(t.eigenschaften.map(klartext).filter(Boolean))}` : '') +
    (t.konfidenz !== 'belegt' ? `<div class="note"><b>Hinweis:</b> Belegstand „${esc(t.konfidenz)}“: nicht alle Werte sind durch eine Quelle belegt; Normverweis und Lebensmittelkontakt gelten als angenommen, bis sie belegt sind.</div>` : '') +
    (t.quelle ? `<div class="src">Quelle: ${esc(t.quelle)}</div>` : '');
}
window.detailState = () => {                                 // Messhilfe fuer die Pruefung: Rahmen der Detailgruppe, Kamera, Sichtbarkeit des Gesamtmodells
  const box = detail.group ? new THREE.Box3().setFromObject(detail.group) : null;
  return { on: detail.on, def: detail.def, s: detail.s, bodies: detail.bodies.length, sel: detail.sel, box: box && [box.min.toArray(), box.max.toArray()],
           cam: camera.position.toArray(), target: controls.target.toArray(), modelVisible: model ? model.visible : null };
};
renderer.domElement.addEventListener('pointerup', e => {     // Klick im Detailmodell waehlt das Teil (durchsichtige Bezugsteile nur, wenn nichts dahinter getroffen wird)
  if (!detail.on || !down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
  const hits = pick(e.clientX, e.clientY, detail.bodies.map(x => x.mesh)), ghost = h => detail.ghost && detail.bodies.find(x => x.mesh === h.object).ref;
  const hit = hits.find(h => !ghost(h)) || hits[0];
  setPart(hit ? detail.bodies.find(x => x.mesh === hit.object).part.id : null);
});

// ---- FPV: in Augenhoehe 1,68 m durch die Kuppel gehen (Masse in mm) -------------------------------------------------
let GROUND = 400; const EYE = 1680, WALK = 1400, TURN = 1.6;      // Boden-Z, Augenhoehe, mm/s, rad/s
const fpv = { on: false, x: 0, y: 0, yaw: 0, pitch: 0, keys: new Set(), saved: null, last: 0, drag: false };
function fpvStart() {
  const door = model && defList.tuer_komplett && defList.tuer_komplett[0];
  const d = door ? Math.hypot(door.m[3], door.m[7]) || 1 : 1, dx = door ? door.m[3] / d : 0, dy = door ? door.m[7] / d : -1;
  fpv.x = dx * 8000; fpv.y = dy * 8000; fpv.yaw = Math.atan2(-dy, -dx); fpv.pitch = 0;   // 8 m vom Mittelpunkt, Blick zur Tuer
}
function fpvEnter() {
  if (fpv.on) return;
  fpv.saved = { pos: camera.position.clone(), target: controls.target.clone(), fov: camera.fov, near: camera.near, clip: clipPlane.constant, up: camera.up.clone() };
  fpvStart(); fpv.on = true; fpv.keys.clear(); fpv.last = 0;
  document.body.classList.add('fpv'); controls.enabled = false; hlGroup.visible = false;
  clipPlane.constant = 100000;
  camera.fov = 75; camera.near = 50; camera.updateProjectionMatrix();
  fpvApply();
}
function fpvExit() {
  if (!fpv.on) return;
  fpv.on = false; fpv.keys.clear(); fpv.drag = false;
  if (document.pointerLockElement) document.exitPointerLock();
  const sv = fpv.saved;
  document.body.classList.remove('fpv'); controls.enabled = true; hlGroup.visible = true;
  clipPlane.constant = sv.clip; camera.fov = sv.fov; camera.near = sv.near; camera.up.copy(sv.up); camera.updateProjectionMatrix();
  camera.position.copy(sv.pos); controls.target.copy(sv.target); controls.update();
}
function fpvApply() {
  camera.position.set(fpv.x, fpv.y, GROUND + EYE);
  const cp = Math.cos(fpv.pitch);
  camera.lookAt(fpv.x + Math.cos(fpv.yaw) * cp, fpv.y + Math.sin(fpv.yaw) * cp, GROUND + EYE + Math.sin(fpv.pitch));
}
function fpvStep(t) {
  const dt = fpv.last ? Math.min((t - fpv.last) / 1000, 0.1) : 0; fpv.last = t;
  const k = c => fpv.keys.has(c), sp = WALK * dt * (k('ShiftLeft') || k('ShiftRight') ? 3 : 1);
  const fw = (k('KeyW') || k('ArrowUp') ? 1 : 0) - (k('KeyS') || k('ArrowDown') ? 1 : 0), st = (k('KeyD') ? 1 : 0) - (k('KeyA') ? 1 : 0);
  fpv.yaw += ((k('ArrowLeft') || k('KeyQ') ? 1 : 0) - (k('ArrowRight') || k('KeyE') ? 1 : 0)) * TURN * dt;
  fpv.x += (Math.cos(fpv.yaw) * fw + Math.sin(fpv.yaw) * st) * sp;
  fpv.y += (Math.sin(fpv.yaw) * fw - Math.cos(fpv.yaw) * st) * sp;
  fpvApply();
}
function fpvLook(dx, dy) {
  fpv.yaw -= dx * 0.0025; fpv.pitch = Math.max(-1.396, Math.min(1.396, fpv.pitch - dy * 0.0025));   // +-80 Grad
}
document.getElementById('fpv').addEventListener('click', fpvEnter);
document.getElementById('fpvx').addEventListener('click', fpvExit);
addEventListener('keydown', e => {
  if (!fpv.on) return;
  if (e.code === 'Escape') { fpvExit(); return; }
  fpv.keys.add(e.code); if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
}, true);
addEventListener('keyup', e => fpv.keys.delete(e.code), true);
addEventListener('blur', () => fpv.keys.clear());
renderer.domElement.addEventListener('pointerdown', e => { if (!fpv.on) return; fpv.drag = true; try { renderer.domElement.requestPointerLock && renderer.domElement.requestPointerLock(); } catch (_) {} });
addEventListener('pointerup', () => { fpv.drag = false; });
addEventListener('pointermove', e => { if (fpv.on && (document.pointerLockElement || fpv.drag)) fpvLook(e.movementX || 0, e.movementY || 0); });
window.fpvState = () => ({ on: fpv.on, x: fpv.x, y: fpv.y, z: camera.position.z, yaw: fpv.yaw, pitch: fpv.pitch });
// ---- Mobilansicht (N-VIEWER-MOBIL): kleines Menue, Touch-Steuerung fuer FPV. Nur bei MOBIL; der FPV-Code oben bleibt unveraendert. ----
if (MOBIL) {
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5)); renderer.setSize(innerWidth, innerHeight);   // weniger Pixel, fluessiger auf dem Handy
  const panel = document.getElementById('panel');
  const mbtn = document.createElement('button'); mbtn.id = 'mbtn'; mbtn.type = 'button'; mbtn.textContent = 'Menü'; mbtn.setAttribute('aria-expanded', 'false');
  document.body.appendChild(mbtn);
  const menue = an => { document.body.classList.toggle('menue-offen', an); mbtn.textContent = an ? 'Menü schließen' : 'Menü'; mbtn.setAttribute('aria-expanded', String(an)); };
  mbtn.addEventListener('click', () => menue(!document.body.classList.contains('menue-offen')));
  renderer.domElement.addEventListener('pointerdown', () => menue(false));
  document.getElementById('fpv').addEventListener('click', () => menue(false));
  document.body.appendChild(document.getElementById('lade'));            // Ladebalken bleibt bei geschlossenem Menue sichtbar
  // Menue klein halten: Bauteilbaum, Auswahl, Drahtgitter, Messstellen, Deckkraft, Kreislauf, Board und Messtext ausblenden
  const weg = el => el && el.classList.add('mnicht');
  ['variante'].forEach(id => weg(document.getElementById(id)));
  ['wire', 'mess'].forEach(id => weg(document.getElementById(id).closest('label')));
  weg(document.getElementById('planeop').parentElement);
  ['tree', 'sel', 'perf', 'board', 'detailbtn', 'expandAll'].forEach(id => { const e = document.getElementById(id); weg(e); if (id === 'expandAll' || id === 'detailbtn') weg(e.parentElement); });
  panel.querySelectorAll('h2').forEach((h, i) => { if (i > 0) weg(h); });         // "Schnitt (Hoehe)" bleibt, Bauteile und Board gehen
  const kl = document.getElementById('klein'), klLabel = kl.closest('label'), note = document.createElement('div');
  note.id = 'mnote'; note.textContent = 'Lädt zusätzlich etwa 30 MB und braucht viel Speicher.'; klLabel.after(note);
  klLabel.lastChild.textContent = ' Kleinteile zeigen';
  hlGroup.visible = false;                                              // kein Auswahl-Leuchten ohne Infopanel
  for (const c of Object.values(CAMS)) c.pos = c.pos.map((v, i) => c.target[i] + (v - c.target[i]) * 1.7);   // Hochformat: weiter weg, damit die Kuppel ins Bild passt
  setCam('iso');

  // Joystick: analog laufen. Die Bewegung geht auf fpv.x/fpv.y; fpvStep ruft danach fpvApply auf.
  const joy = document.createElement('div'), knob = document.createElement('i'); joy.id = 'mjoy'; joy.appendChild(knob); document.body.appendChild(joy);
  let jid = null, jx = 0, jy = 0, jt = 0; const R = 50;
  const jset = e => { const r = joy.getBoundingClientRect(); let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2); const d = Math.hypot(dx, dy); if (d > R) { dx *= R / d; dy *= R / d; }
    jx = dx / R; jy = dy / R; knob.style.transform = `translate(${dx}px,${dy}px)`; };
  const jend = e => { if (e.pointerId !== jid) return; jid = null; jx = jy = 0; knob.style.transform = ''; };
  joy.addEventListener('pointerdown', e => { if (jid !== null) return; jid = e.pointerId; try { joy.setPointerCapture(jid); } catch (_) {} jset(e); e.preventDefault(); e.stopPropagation(); });
  joy.addEventListener('pointermove', e => { if (e.pointerId === jid) jset(e); });
  joy.addEventListener('pointerup', jend); joy.addEventListener('pointercancel', jend);
  (function joyLoop(t) {
    const dt = jt ? Math.min((t - jt) / 1000, 0.1) : 0; jt = t;
    if (fpv.on && (jx || jy)) {
      const fw = -jy, st = jx, sp = WALK * dt;                       // oben = vor, rechts = seitlich rechts (wie W/D)
      fpv.x += (Math.cos(fpv.yaw) * fw + Math.sin(fpv.yaw) * st) * sp;
      fpv.y += (Math.sin(fpv.yaw) * fw - Math.cos(fpv.yaw) * st) * sp;
    }
    requestAnimationFrame(joyLoop);
  })(0);
  // Umschauen: ein Finger auf der Szene wischt den Blick (Joystick-Finger zaehlt nicht)
  let lid = null, lx = 0, ly = 0;
  renderer.domElement.addEventListener('pointerdown', e => { if (fpv.on && e.pointerType !== 'mouse' && lid === null) { lid = e.pointerId; lx = e.clientX; ly = e.clientY; } });
  addEventListener('pointermove', e => {
    if (!fpv.on || e.pointerType === 'mouse' || e.target === joy) return;
    if (e.pointerId === lid) { fpvLook((e.clientX - lx) * 1.4, (e.clientY - ly) * 1.4); lx = e.clientX; ly = e.clientY; }
    e.stopImmediatePropagation();                                         // der Desktop-Zweig liest movementX und wuerde sonst doppelt drehen
  }, true);
  const lend = e => { if (e.pointerId === lid) lid = null; };
  addEventListener('pointerup', lend, true); addEventListener('pointercancel', e => { lend(e); fpv.drag = false; }, true);
  document.getElementById('fpvx').addEventListener('click', () => { jid = null; jx = jy = 0; knob.style.transform = ''; lid = null; hlGroup.visible = false; });
  window.mobilStand = () => ({ mobil: true, menueOffen: document.body.classList.contains('menue-offen'), klein: kleinOn, cacheGroesse: defCache.size });   // Messhaken
}
(function loop(t) {
  const p = 0.45 + 0.25 * Math.sin(t / 220); hlMat.hover.opacity = p; hlMat.sel.opacity = 0.35 + 0.25 * Math.sin(t / 300 + 1);
  if (fpv.on) fpvStep(t); else controls.update();
  kreisSicht(); renderer.render(scene, camera); requestAnimationFrame(loop);
})(0);
</script>
