<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kuppel Live-Viewer</title>
<style>
  :root { --bg:#0f1720; --panel:#17212c; --line:#2a3846; --text:#e6edf3; --muted:#9fb0c0; --accent:#4cc38a; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:13px/1.4 system-ui, sans-serif; overflow:hidden; }
  #view { position:fixed; inset:0; }
  #panel { position:fixed; top:10px; left:10px; width:250px; max-height:calc(100% - 20px); overflow:auto; background:var(--panel);
           border:1px solid var(--line); border-radius:8px; padding:10px; }
  #panel h1 { font-size:14px; margin:0 0 6px; }
  #status { color:var(--muted); font-size:12px; margin-bottom:8px; }
  #status b { color:var(--accent); font-weight:600; }
  .row { display:flex; flex-wrap:wrap; gap:4px; margin:6px 0; }
  button { background:#223142; color:var(--text); border:1px solid var(--line); border-radius:5px; padding:4px 8px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--accent); }
  label { display:flex; align-items:center; gap:6px; padding:1px 0; cursor:pointer; }
  .sw { width:10px; height:10px; border-radius:2px; border:1px solid #0006; flex:none; }
  input[type=range] { width:100%; }
  h2 { font-size:12px; margin:10px 0 4px; color:var(--muted); font-weight:600; }
</style>
<script type="importmap">
{ "imports": { "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="view"></div>
<div id="panel">
  <h1>Kuppel Live-Viewer</h1>
  <div id="status">verbinde ...</div>
  <div class="row">
    <button data-cam="iso">Ansicht ref-4</button><button data-cam="top">Oben</button>
    <button data-cam="side">Seite</button><button data-cam="pool">Pool</button> <a href="/history/" target="_blank" style="color:inherit">Bildverlauf</a>
  </div>
  <label><input type="checkbox" id="wire"> Drahtgitter</label>
  <label><input type="checkbox" id="auto" checked> Auto-Update</label>
  <h2>Schnitt (Hoehe)</h2>
  <input type="range" id="clip" min="0" max="7000" value="7000">
  <h2>Bauteil-Stand (Board)</h2>
  <div id="board" style="font-size:12px"></div>
  <div id="perf" style="color:var(--muted);font-size:11px;margin-top:6px"></div>
  <h2>Gruppen</h2>
  <div id="groups"></div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.localClippingEnabled = true;
view.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f1720);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 100, 400000);
camera.up.set(0, 0, 1);                       // Z ist oben, Masse in mm
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.3));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(-8000, -12000, 16000); scene.add(sun);

const CAMS = {
  iso:  { pos: [0, -19000, 11000], target: [0, 0, 2200] },
  top:  { pos: [0, -1, 26000],      target: [0, 0, 0] },
  side: { pos: [0, -26000, 3200],   target: [0, 0, 3000] },
  pool: { pos: [3500, -5500, 3200], target: [0, 0, 300] },
};
function setCam(k) { const c = CAMS[k]; camera.position.set(...c.pos); controls.target.set(...c.target); controls.update(); }
setCam('iso');

const clipPlane = new THREE.Plane(new THREE.Vector3(0, 0, -1), 7000);
const mats = new Map();
function matFor(color, opacity) {
  const key = color + '|' + opacity;
  if (!mats.has(key)) mats.set(key, new THREE.MeshStandardMaterial({
    color, flatShading: true, side: THREE.DoubleSide, roughness: 0.65, metalness: 0.1,
    transparent: opacity < 1, opacity, clippingPlanes: [clipPlane], depthWrite: opacity >= 1 }));
  return mats.get(key);
}

let model = null, extras = {}, groupsOn = {}, version = -1;
const loader = new OBJLoader();
const defCache = new Map();                                 // Definitionsname -> {text, built}: unveraenderte Definitionen werden nicht neu geladen

const baseName = n => n.replace(/ \(.*$/, '');            // Koerpernamen: "T1_Strebe_A", "Wanne (2)"
function groupKey(name) { return baseName(name).replace(/_\d+[A-Z]?$/, '').replace(/ ?\d+$/, ''); }
const DEFCOL = [[/^tank_/, '#93b49a'], [/^pumpe_/, '#2a5da8'], [/^ibc_beet/, '#c9ccc4'], [/^nft_tisch/, '#9aa6b2'], [/^strebe/, '#b9c0c8']];
function colorFor(name, def) {
  const base = baseName(name);
  const c = extras.colors && (extras.colors[base] || extras.colors[Object.keys(extras.colors).find(k => k.replace(/_\d+$/, '') === base.replace(/_\d+$/, ''))]);
  if (c) return matFor(c[0], c[1]);
  const P = [[/^T5_Wasser|^T6_Wasser/, '#3c8ed0', 0.85], [/^T13_/, '#8a6f4d', 1], [/^T1_/, '#b9c0c8', 1], [/^T3_/, '#cfcfca', 1],
             [/^T4_/, '#1c1c1c', 1], [/^T5_|^T6_|^T7_/, '#93b49a', 1], [/^T8_/, '#f3f3f1', 1], [/^T9_/, '#ffffff', 1],
             [/^T10_/, '#5fa8e0', 1], [/^T11_/, '#8b9096', 1], [/^T12_/, '#4c9a3c', 1]];
  const hit = P.find(p => p[0].test(base));
  if (hit) return matFor(hit[1], hit[2]);
  const d = DEFCOL.find(p => p[0].test(def));
  if (/Wasser|Medium/.test(base)) return matFor(/Wasser/.test(base) ? '#3c8ed0' : '#8a6f4d', /Wasser/.test(base) ? 0.85 : 1);
  return matFor(d ? d[1] : '#b0b8c0', 1);
}
function buildGroups() {
  const keys = new Map();
  model.traverse(o => { if (o.isMesh) { const k = o.userData.group; (keys.get(k) || keys.set(k, []).get(k)).push(o); } });
  const box = document.getElementById('groups'); box.innerHTML = '';
  [...keys.keys()].sort().forEach(k => {
    const first = keys.get(k)[0], c = first.material.color.getStyle();
    const n = keys.get(k).reduce((s, o) => s + o.count, 0);
    const lab = document.createElement('label');
    lab.innerHTML = `<input type="checkbox" checked><span class="sw" style="background:${c}"></span>${k} (${n})`;
    lab.querySelector('input').addEventListener('change', e => { groupsOn[k] = e.target.checked; keys.get(k).forEach(o => o.visible = e.target.checked); });
    if (k in groupsOn) { lab.querySelector('input').checked = groupsOn[k]; keys.get(k).forEach(o => o.visible = groupsOn[k]); }
    box.appendChild(lab);
  });
}
async function load() {
  const v = Date.now();
  const [inst, ex] = await Promise.all([fetch('instances.json?v=' + v).then(r => r.json()), fetch('extras.json?v=' + v).then(r => r.json())]);
  extras = ex;
  const m = new THREE.Group(); const t0 = performance.now();
  await Promise.all(Object.entries(inst.defs).map(async ([stem, d]) => {
    const key = stem + '|' + d.kb;                          // Groesse als Versionsmerkmal der Definition
    if (!defCache.has(key)) defCache.set(key, await fetch(`defs/${stem}.obj?k=${d.kb}`).then(r => r.text()));
  }));
  const byDef = {}; inst.instances.forEach(i => (byDef[i.d] || (byDef[i.d] = [])).push(i));
  for (const [stem, list] of Object.entries(byDef)) {
    const g = loader.parse(defCache.get(stem + '|' + inst.defs[stem].kb));
    const mats = list.map(i => new THREE.Matrix4().set(...i.m, 0, 0, 0, 1));
    g.traverse(o => {
      if (!o.isMesh) return;
      const name = o.name || o.parent.name;
      const im = new THREE.InstancedMesh(o.geometry, colorFor(name, stem), list.length);
      mats.forEach((mx, i) => im.setMatrixAt(i, mx));
      im.frustumCulled = false; im.name = name; im.userData.group = groupKey(name); m.add(im);
    });
  }
  if (model) { scene.remove(model); model.traverse(o => o.geometry && !o.isInstancedMesh && o.geometry.dispose()); }
  model = m; scene.add(model);
  document.getElementById('perf').textContent = `${inst.instances.length} Instanzen, ${Object.keys(inst.defs).length} Definitionen, ${(Object.values(inst.defs).reduce((s, d) => s + d.kb, 0) / 1024).toFixed(1)} MB, Aufbau ${((performance.now() - t0) / 1000).toFixed(1)} s, Kleinteile < ${inst.min_diag} mm ausgeblendet`;
  buildGroups(); applyWire();
}
function applyWire() { const w = document.getElementById('wire').checked; mats.forEach(m => m.wireframe = w); }
document.getElementById('wire').addEventListener('change', applyWire);
document.getElementById('clip').addEventListener('input', e => { clipPlane.constant = +e.target.value; });
document.querySelectorAll('[data-cam]').forEach(b => b.addEventListener('click', () => setCam(b.dataset.cam)));

async function poll() {
  const st = document.getElementById('status');
  try {
    const s = await fetch('/api/state?t=' + Date.now()).then(r => r.json());
    const auto = document.getElementById('auto').checked;
    st.innerHTML = `Modell gespeichert <b>${s.design_saved || '-'}</b> · Viewer <b>${s.built || '-'}</b>` +
      (s.busy ? ' · <b>exportiert ...</b>' : '') + (s.error ? '<br>Fehler: ' + s.error.replace(/</g, '&lt;') : '') +
      (extras.bodies ? `<br>${extras.bodies} Instanzen` : '');
    if (auto && s.version !== version && s.version > 0) { version = s.version; await load(); }
  } catch (e) { st.textContent = 'Server nicht erreichbar'; }
}
async function pollBoard() {
  try {
    const rows = await fetch('/api/board?t=' + Date.now()).then(r => r.json());
    const col = s => /eingebaut/.test(s) ? '#4cc38a' : /abgenommen/.test(s) ? '#7fd3a8' : /L3|L4/.test(s) ? '#d9c35b' : /Arbeit|L2/.test(s) ? '#e0954a' : '#7a8896';
    document.getElementById('board').innerHTML = rows.map(r =>
      `<div style="display:flex;gap:6px;align-items:baseline;padding:1px 0"><span class="sw" style="background:${col(r.status)}"></span>` +
      `<span style="flex:1">${r.klasse.replace(/</g, '&lt;')} <span style="color:var(--muted)">(${r.n}, ${r.wer})</span></span></div>` +
      `<div style="color:var(--muted);margin:0 0 3px 16px">${r.status.replace(/</g, '&lt;')}</div>`).join('');
  } catch (e) {}
}
setInterval(poll, 2000); poll(); setInterval(pollBoard, 5000); pollBoard();
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
(function loop() { controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop); })();
</script>
</body>
</html>
