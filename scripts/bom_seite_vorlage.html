<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Einkaufsliste Kuppel</title>
<style>
:root{
  --bg:#f6f7f5; --flaeche:#ffffff; --flaeche2:#eef0ec; --text:#1d2420; --text2:#59635d; --linie:#d8ddd6;
  --akzent:#1f6b4f; --akzent-text:#ffffff; --ok:#1f6b4f; --hinweis:#8a5a00; --fehlt:#a3321f;
  --ok-bg:#e1f1e8; --hinweis-bg:#fbefd2; --fehlt-bg:#f9e0db; --fokus:#0b5cd5;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141a17; --flaeche:#1c2420; --flaeche2:#25302b; --text:#e6ebe7; --text2:#a1ada6; --linie:#34413a;
    --akzent:#5fc79c; --akzent-text:#0f1c16; --ok:#6fd3a8; --hinweis:#f0c46a; --fehlt:#ff9e8c;
    --ok-bg:#1f3a2e; --hinweis-bg:#3d3216; --fehlt-bg:#4a2620; --fokus:#7db2ff;
  }
}
:root[data-theme="dark"]{
  --bg:#141a17; --flaeche:#1c2420; --flaeche2:#25302b; --text:#e6ebe7; --text2:#a1ada6; --linie:#34413a;
  --akzent:#5fc79c; --akzent-text:#0f1c16; --ok:#6fd3a8; --hinweis:#f0c46a; --fehlt:#ff9e8c;
  --ok-bg:#1f3a2e; --hinweis-bg:#3d3216; --fehlt-bg:#4a2620; --fokus:#7db2ff;
}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.seite{max-width:1280px;margin:0 auto;padding:20px 16px 64px}
.kopfzeile{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 0 14px;border-bottom:1px solid var(--linie)}
.kopfzeile .pfad{font-weight:600;font-size:17px}
.kopfzeile .pfad span{color:var(--text2);font-weight:400}
.platz{flex:1}
button,select,input{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible,th button:focus-visible{outline:3px solid var(--fokus);outline-offset:2px}
.erklaersatz{margin:16px 0 4px;font-size:16px}
.erklaersatz strong{font-variant-numeric:tabular-nums}
.klein{color:var(--text2);font-size:13px}
.kennzahlen{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:14px 0}
.kachel{background:var(--flaeche);border:1px solid var(--linie);border-radius:10px;padding:12px 14px}
.kachel .wert{font-size:24px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.2}
.kachel .name{color:var(--text2);font-size:13px}
.werkzeuge{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin:16px 0 8px;background:var(--flaeche);border:1px solid var(--linie);border-radius:10px;padding:10px 12px}
.umschalter{display:inline-flex;border:1px solid var(--linie);border-radius:8px;overflow:hidden}
.umschalter button{background:transparent;border:0;padding:7px 14px;cursor:pointer}
.umschalter button[aria-pressed="true"]{background:var(--akzent);color:var(--akzent-text);font-weight:600}
.werkzeuge label{display:inline-flex;align-items:center;gap:6px;font-size:14px}
.werkzeuge input[type=search],.werkzeuge select{background:var(--flaeche2);border:1px solid var(--linie);border-radius:8px;padding:6px 10px;min-width:0}
.werkzeuge input[type=search]{width:220px;max-width:100%}
.knopf{background:var(--flaeche2);border:1px solid var(--linie);border-radius:8px;padding:6px 12px;cursor:pointer}
.sprung{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px;align-items:center}
.sprung a{display:inline-flex;gap:6px;align-items:baseline;padding:3px 10px;border:1px solid var(--linie);border-radius:999px;background:var(--flaeche);color:var(--text);text-decoration:none;font-size:13px}
.sprung a b{font-weight:650}
.sprung a:hover{border-color:var(--akzent)}
.tabelle-rahmen{background:var(--flaeche);border:1px solid var(--linie);border-radius:10px;overflow:hidden}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--linie)}
thead th{background:var(--flaeche2);position:sticky;top:0;z-index:2;font-size:13px;white-space:nowrap}
thead th button{all:unset;cursor:pointer;display:inline-flex;gap:6px;align-items:center;font-weight:650}
thead th button::after{content:"";border:4px solid transparent;border-top-color:var(--text2);opacity:.35;margin-top:4px}
thead th[aria-sort="ascending"] button::after{border-top-color:transparent;border-bottom-color:var(--akzent);opacity:1;margin-top:-4px}
thead th[aria-sort="descending"] button::after{border-top-color:var(--akzent);opacity:1}
td.zahl,th.zahl{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.zahl .grund{white-space:normal;margin-left:auto}
th.zahl button{flex-direction:row-reverse}
tr.block td{background:var(--flaeche2);font-weight:650;border-top:2px solid var(--akzent);scroll-margin-top:50px}
tr.block .summe{font-variant-numeric:tabular-nums;color:var(--akzent)}
tr.nicht-platziert td{color:var(--text2)}
.teil .id{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;color:var(--text2)}
.teil .bez{font-weight:550}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:650;white-space:nowrap}
.chip svg{width:13px;height:13px;flex:none}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.hinweis{background:var(--hinweis-bg);color:var(--hinweis)}
.chip.fehlt{background:var(--fehlt-bg);color:var(--fehlt)}
.grund{display:block;color:var(--text2);font-size:12px;margin-top:3px;max-width:34ch}
a.bezug{color:var(--akzent);word-break:break-word}
.leer{padding:36px 16px;text-align:center;color:var(--text2)}
@media (max-width:820px){
  .seite{padding:12px 16px 48px}
  table,thead,tbody,tr,td{display:block}
  thead{position:static}
  thead tr{display:flex;flex-wrap:wrap;gap:4px;padding:8px;background:var(--flaeche2);border-bottom:1px solid var(--linie)}
  thead th{display:block;background:transparent;border:0;padding:2px 4px;position:static}
  tbody tr{padding:10px 12px;border-bottom:1px solid var(--linie)}
  tbody tr.block{padding:8px 12px}
  tbody td{display:flex;justify-content:space-between;gap:12px;border:0;padding:3px 0;text-align:right}
  tbody td::before{content:attr(data-label);color:var(--text2);font-size:12px;text-align:left;flex:none;min-width:84px}
  
  tr.block td{display:flex;border:0;background:transparent}
  tr.block td::before{content:none}
  tbody tr.block{background:var(--flaeche2);border-top:2px solid var(--akzent)}
  .grund{max-width:none;text-align:right}
  .werkzeuge label{width:100%}
  .werkzeuge select,.werkzeuge input[type=search]{flex:1;width:100%;max-width:100%}
  .kachel .wert{font-size:20px}
}
</style>
</head>
<body>
<div class="seite">
  <div class="kopfzeile">
    <div class="pfad">Kuppel <span>/</span> Einkaufsliste</div>
    <div class="platz"></div>
    <div class="umschalter" role="group" aria-label="Ansicht">
      <button type="button" id="m-gruppe" aria-pressed="true">Gruppiert</button>
      <button type="button" id="m-typ" aria-pressed="false">Nach Typ</button>
    </div>
  </div>

  <p class="erklaersatz" id="satz"></p>
  <p class="klein" id="satz2"></p>
  <div class="kennzahlen" id="kennzahlen"></div>

  <div class="werkzeuge">
    <label>Suche <input type="search" id="suche" placeholder="Teil, Teilenummer, Händler"></label>
    <label>Typ <select id="f-typ"></select></label>
    <label>Gruppe <select id="f-gruppe"></select></label>
    <label><input type="checkbox" id="f-ohne"> nur Zeilen ohne Preis</label>
    <label><input type="checkbox" id="f-np"> nicht platzierte Komponenten zeigen</label>
    <button type="button" id="f-reset" class="knopf">Sortierung aufheben</button>
  </div>
  <nav class="sprung" id="sprung" aria-label="Sprungleiste"></nav>

  <div class="tabelle-rahmen">
    <table id="tab">
      <thead><tr id="kopf"></tr></thead>
      <tbody id="koerper"></tbody>
    </table>
    <div class="leer" id="leer" hidden>Kein Teil passt zu diesen Filtern. Die Filter oben zurücksetzen zeigt wieder alle Zeilen.</div>
  </div>
  <p class="klein" id="fuss" style="margin-top:14px"></p>
</div>

<script id="daten" type="application/json">__DATEN__</script>
<script>
(function(){
"use strict";
var D = JSON.parse(document.getElementById("daten").textContent);
var K = D.kopf;
var EUR = new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR"});
var NUM = new Intl.NumberFormat("de-DE",{maximumFractionDigits:3});
var ICON = {
  ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>',
  hinweis:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>',
  fehlt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg>'
};
var EINH = {"Stk":"Stück","Satz":"Satz","m":"m","m2":"m²","m3":"m³"};
var state = {modus:"gruppe", key:null, dir:"asc", q:"", typ:"", gruppe:"", ohne:false, np:false};
var SPALTEN = [
  {k:"id", t:"Teilenummer", zahl:false},
  {k:"bez", t:"Teil", zahl:false},
  {k:"typ", t:"Typ", zahl:false},
  {k:"gruppe", t:"Gruppe", zahl:false},
  {k:"menge", t:"Menge", zahl:true},
  {k:"kauf", t:"Kaufmenge", zahl:true},
  {k:"einzel", t:"Stückpreis", zahl:true},
  {k:"preis", t:"Gesamtpreis", zahl:true},
  {k:"quelle", t:"Bezugsquelle", zahl:false},
  {k:"status", t:"Status", zahl:false}
];

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function datum(s){ if(!s) return ""; var p=s.split("-"); return p.length===3? p[2]+"."+p[1]+"."+p[0] : s; }
function einh(e){return EINH[e]||e;}

// ---- Zeilen aufbereiten: je Gruppe eine Ansichtszeile (Gruppiert) oder eine Zeile je Teil (Nach Typ)
function ansichtszeilen(){
  var rows = [];
  D.zeilen.forEach(function(z){
    if(state.modus==="gruppe"){
      var gr = z.gr.length ? z.gr : [{g:"ohne Gruppe", menge:z.bedarf, preis:(z.p&&!z.np)?z.p.g:null, komp:[]}];
      gr.forEach(function(g){ if(!z.np && g.menge===0) return; rows.push(mk(z, g.g, g.menge, g.preis, g.komp)); });
    } else {
      var names = z.gr.map(function(g){return g.g;});
      rows.push(mk(z, names.join(", "), z.bedarf, (z.p&&!z.np)?z.p.g:null, []));
    }
  });
  return rows;
}
function mk(z, gruppe, menge, preis, komp){
  return {z:z, id:z.id, bez:z.bez, typ:z.typ, gruppe:gruppe, menge:z.np?0:menge, preis:preis,
          einzel: z.p? z.p.e : null, kauf: z.kauf, quelle: z.p? z.p.h : "", status:z.status, komp:komp};
}
function passt(r){
  var z=r.z;
  if(!state.np && z.np) return false;
  if(state.typ && z.typ!==state.typ) return false;
  if(state.gruppe && !z.gr.some(function(g){return g.g===state.gruppe;})) return false;
  if(state.modus==="gruppe" && state.gruppe && r.gruppe!==state.gruppe) return false;
  if(state.ohne && z.p) return false;
  if(state.q){
    var hay=(z.id+" "+z.bez+" "+(z.p?z.p.h:"")+" "+z.typ+" "+r.gruppe).toLowerCase();
    if(hay.indexOf(state.q.toLowerCase())<0) return false;
  }
  return true;
}
function wert(r,k){
  if(k==="preis"||k==="einzel"||k==="menge"||k==="kauf"){ var v=r[k]; return v==null? null : v; }
  return String(r[k]==null?"":r[k]).toLowerCase();
}
function vergleich(a,b,k,dir){
  var x=wert(a,k), y=wert(b,k), f = dir==="asc"?1:-1;
  var zahl = (k==="preis"||k==="einzel"||k==="menge"||k==="kauf");
  if(zahl){
    if(x==null&&y==null) return 0;
    if(x==null) return 1;          // leere Werte immer ans Ende
    if(y==null) return -1;
    return (x-y)*f;
  }
  return x<y? -f : x>y? f : 0;
}
function standardOrdnung(a,b){
  if(a.typ!==b.typ) return a.typ<b.typ?-1:1;
  return a.id<b.id?-1:a.id>b.id?1:0;
}

function render(){
  var rows = ansichtszeilen().filter(passt);
  var gesamt = rows.reduce(function(s,r){return s+(r.preis||0);},0);
  var kopf = document.getElementById("kopf");
  var html = [];
  var gesehenTyp = {};
  function zeile(r){
    var z=r.z, p=z.p;
    var cls = z.np? ' class="nicht-platziert"' : '';
    var idAttr = "";
    if(!gesehenTyp[z.typ]){ gesehenTyp[z.typ]=true; idAttr=' id="typ-'+esc(z.typ)+'"'; }
    var menge = z.np ? 'nicht im Modell platziert<span class="grund">je 1 Komponente: '+NUM.format(z.einmal)+' '+esc(einh(z.einheit))+'</span>'
                     : NUM.format(r.menge)+' '+esc(einh(z.einheit));
    var kauf = z.np ? "–" : (z.kauf!=null ? NUM.format(z.kauf)+' '+esc(einh(z.einheit)) + (z.stangen? '<span class="grund">'+z.stangen+' Stangen à '+NUM.format(z.lager)+' mm</span>':'') : "–");
    var einzel = p? EUR.format(p.e)+'<span class="grund">je '+esc(einh(p.b))+(p.a?' (Preis von '+esc(p.a)+')':'')+'</span>' : "–";
    var preis = p&&!z.np ? EUR.format(r.preis) : (z.np && z.pe!=null ? '<span class="grund">je 1: '+EUR.format(z.pe)+'</span>' : "–");
    var quelle;
    if(p){
      quelle = (p.u? '<a class="bezug" href="'+esc(p.u)+'" target="_blank" rel="noopener noreferrer">'+esc(p.h)+'</a>' : esc(p.h))
        + '<span class="grund">'+esc(p.l)+' · Stand '+esc(datum(p.s))+' · Lieferung nach Deutschland: '+(p.d==="ja"?"ja":"nicht geprüft")+' · Beleg '+esc(p.k)+'</span>';
    } else { quelle = '<span class="grund">'+esc(z.grund||"")+'</span>'; }
    var code = z.status==="OK" ? "ok" : (z.status.indexOf("(Quelle)")>=0 ? "fehlt" : "hinweis");
    var wort = code==="ok" ? "ok" : (code==="fehlt" ? "fehlt" : "hinweis");
    var stat = '<span class="chip '+code+'">'+ICON[code]+wort+'</span>'+(z.status!=="OK"? '<span class="grund">'+esc(z.status)+(p&&z.status!=="OK"?' – Preis gilt für die heutige Variante':'')+'</span>':'');
    return '<tr'+cls+idAttr+'>'
      +'<td class="teil" data-label="Teilenummer"><span class="id">'+esc(z.id)+'</span></td>'
      +'<td class="teil" data-label="Teil"><span class="bez">'+esc(z.bez)+'</span></td>'
      +'<td data-label="Typ">'+esc(z.typ)+'</td>'
      +'<td data-label="Gruppe">'+esc(r.gruppe)+'</td>'
      +'<td class="zahl" data-label="Menge">'+menge+'</td>'
      +'<td class="zahl" data-label="Kaufmenge">'+kauf+'</td>'
      +'<td class="zahl" data-label="Stückpreis">'+einzel+'</td>'
      +'<td class="zahl" data-label="Gesamtpreis">'+preis+'</td>'
      +'<td data-label="Bezugsquelle">'+quelle+'</td>'
      +'<td data-label="Status">'+stat+'</td></tr>';
  }
  kopf.innerHTML = SPALTEN.map(function(s){
    var sort = state.key===s.k ? (state.dir==="asc"?"ascending":"descending") : "none";
    return '<th scope="col" class="'+(s.zahl?"zahl":"")+'" aria-sort="'+sort+'"><button type="button" data-k="'+s.k+'">'+esc(s.t)+'</button></th>';
  }).join("");

  var blocks = [];
  if(state.modus==="gruppe"){
    var order = D.gruppen.concat(["ohne Gruppe"]);
    order.forEach(function(g){
      var rs = rows.filter(function(r){return r.gruppe===g;});
      if(!rs.length) return;
      rs.sort(function(a,b){ return state.key? (vergleich(a,b,state.key,state.dir)||standardOrdnung(a,b)) : standardOrdnung(a,b); });
      blocks.push({g:g, rows:rs, summe:rs.reduce(function(s,r){return s+(r.preis||0);},0)});
    });
    if(state.key){
      // Blöcke nach ihrem besten Wert ordnen, damit die erste Zeile der Liste der Extremwert der gewählten Spalte ist
      blocks.sort(function(A,B){ return vergleich(A.rows[0],B.rows[0],state.key,state.dir); });
    }
    blocks.forEach(function(b){
      var anzahl = b.rows.length;
      html.push('<tr class="block" id="gruppe-'+esc(b.g.replace(/ /g,"-"))+'"><td colspan="10"><span>'+esc(b.g)+'</span> <span class="klein" style="font-weight:400">· '+anzahl+(anzahl===1?' Teil':' Teile')+' · Gruppenpreis </span><span class="summe">'+EUR.format(b.summe)+'</span></td></tr>');
      b.rows.forEach(function(r){html.push(zeile(r));});
    });
  } else {
    var alle = rows.slice();
    if(state.key){
      alle.sort(function(a,b){return vergleich(a,b,state.key,state.dir)||standardOrdnung(a,b);});
      alle.forEach(function(r){html.push(zeile(r));});
    } else {
      alle.sort(standardOrdnung);
      var typ=null, summe={}, anz={};
      alle.forEach(function(r){summe[r.typ]=(summe[r.typ]||0)+(r.preis||0); anz[r.typ]=(anz[r.typ]||0)+1;});
      alle.forEach(function(r){
        if(r.typ!==typ){ typ=r.typ;
          html.push('<tr class="block" id="abschnitt-'+esc(typ)+'"><td colspan="10"><span>'+esc(typ)+' · '+esc(D.typen[typ]||"")+'</span> <span class="klein" style="font-weight:400">· '+anz[typ]+(anz[typ]===1?' Teil':' Teile')+' · Summe </span><span class="summe">'+EUR.format(summe[typ])+'</span></td></tr>');
        }
        html.push(zeile(r));
      });
    }
  }
  document.getElementById("koerper").innerHTML = html.join("");
  document.getElementById("leer").hidden = rows.length>0;
  document.getElementById("tab").hidden = rows.length===0;
  document.getElementById("fuss").textContent = "Zeilen in der Ansicht: "+rows.length+" · Summe der Ansicht: "+EUR.format(gesamt)+" · Preise sind Richtwerte mit Datum, keine Angebote.";
  document.getElementById("m-gruppe").setAttribute("aria-pressed", state.modus==="gruppe");
  document.getElementById("m-typ").setAttribute("aria-pressed", state.modus==="typ");
  sprungleiste(rows);
  window.__ansicht = {zeilen:rows.length, summe:Math.round(gesamt*100)/100};
}

function sprungleiste(rows){
  var nav=document.getElementById("sprung");
  var h=[];
  if(state.modus==="gruppe"){
    h.push('<span class="klein">Springe zu Gruppe:</span>');
    D.gruppen.forEach(function(g){
      var n=rows.filter(function(r){return r.gruppe===g;}).length;
      if(n) h.push('<a href="#gruppe-'+esc(g.replace(/ /g,"-"))+'"><b>'+esc(g)+'</b>'+n+'</a>');
    });
  } else {
    h.push('<span class="klein">Springe zu Typ:</span>');
    Object.keys(D.typen).forEach(function(t){
      var n=rows.filter(function(r){return r.typ===t;}).length;
      if(n) h.push('<a href="#'+(state.key?'typ-':'abschnitt-')+esc(t)+'" title="'+esc(D.typen[t])+'"><b>'+esc(t)+'</b>'+n+'</a>');
    });
  }
  nav.innerHTML=h.join("");
}

function kopfbereich(){
  document.getElementById("satz").innerHTML = 'Die Kuppel braucht Kaufteile für <strong>'+EUR.format(K.summe)+'</strong> brutto, gerechnet aus dem Modellstand mit '+K.instanzen+' Bauteilen.';
  var s2 = 'Preise sind Richtwerte mit Datum (jüngster Stand '+datum(K.stand_preise)+'), keine Angebote. Mengen kommen aus dem Modell, nicht aus Schätzungen. Modellstand vom '+esc(K.modell)+'.';
  if(K.drift) s2 += ' Die Modelldateien haben sich seit der Messung geändert; die Liste muss neu erzeugt werden.';
  document.getElementById("satz2").innerHTML = s2;
  var kach = [
    [EUR.format(K.summe),"Summe aller platzierten Zeilen mit Preis"],
    [String(K.zeilen - K.np),"Zeilen im Modell platziert"],
    [String(K.ohne_preis),"Preis fehlt (Grund steht in der Zeile)"],
    [String(K.np),"Zeilen nur in nicht platzierten Komponenten ("+EUR.format(K.np_einmal.summe_eur)+" bei je einem Stück, nicht in der Summe)"]
  ];
  document.getElementById("kennzahlen").innerHTML = kach.map(function(x){return '<div class="kachel"><div class="wert">'+esc(x[0])+'</div><div class="name">'+esc(x[1])+'</div></div>';}).join("");
  var ft=document.getElementById("f-typ"); ft.innerHTML='<option value="">alle Typen</option>'+Object.keys(D.typen).map(function(t){return '<option value="'+esc(t)+'">'+esc(t)+' – '+esc(D.typen[t])+'</option>';}).join("");
  var fg=document.getElementById("f-gruppe"); fg.innerHTML='<option value="">alle Gruppen</option>'+D.gruppen.map(function(g){return '<option>'+esc(g)+'</option>';}).join("");
}

document.getElementById("kopf").addEventListener("click", function(e){
  var b = e.target.closest("button[data-k]"); if(!b) return;
  var k=b.getAttribute("data-k");
  if(state.key===k){ state.dir = state.dir==="asc"?"desc":"asc"; }
  else { state.key=k; state.dir = (k==="preis"||k==="einzel"||k==="menge"||k==="kauf") ? "desc" : "asc"; }
  render();
});
document.getElementById("m-gruppe").addEventListener("click", function(){ state.modus="gruppe"; render(); });
document.getElementById("m-typ").addEventListener("click", function(){ state.modus="typ"; render(); });
document.getElementById("f-reset").addEventListener("click", function(){ state.key=null; state.dir="asc"; render(); });
document.getElementById("suche").addEventListener("input", function(e){ state.q=e.target.value.trim(); render(); });
document.getElementById("f-typ").addEventListener("change", function(e){ state.typ=e.target.value; render(); });
document.getElementById("f-gruppe").addEventListener("change", function(e){ state.gruppe=e.target.value; render(); });
document.getElementById("f-ohne").addEventListener("change", function(e){ state.ohne=e.target.checked; render(); });
document.getElementById("f-np").addEventListener("change", function(e){ state.np=e.target.checked; render(); });

window.__daten = D;
kopfbereich();
render();
})();
</script>
</body>
</html>
