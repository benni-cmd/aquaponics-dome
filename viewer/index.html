<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kuppel Live-Viewer</title>
<style>
  :root { --bg:#0f1720; --panel:#17212c; --line:#2a3846; --text:#e6edf3; --muted:#9fb0c0; --accent:#4cc38a; --hover:#ffc247; --sel:#4de1ff; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:13px/1.4 system-ui, sans-serif; overflow:hidden; }
  #view { position:fixed; inset:0; }
  #panel { position:fixed; top:10px; left:10px; width:330px; max-height:calc(100% - 20px); overflow:auto; background:var(--panel);
           border:1px solid var(--line); border-radius:8px; padding:10px; }
  #panel h1 { font-size:14px; margin:0 0 6px; }
  #status { color:var(--muted); font-size:12px; margin-bottom:8px; }
  #status b { color:var(--accent); font-weight:600; }
  .row { display:flex; flex-wrap:wrap; gap:4px; margin:6px 0; }
  button { background:#223142; color:var(--text); border:1px solid var(--line); border-radius:5px; padding:4px 8px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--accent); }
  label.opt { display:flex; align-items:center; gap:6px; padding:1px 0; cursor:pointer; }
  .sw { width:10px; height:10px; border-radius:2px; border:1px solid #0006; flex:none; }
  input[type=range] { width:100%; }
  h2 { font-size:12px; margin:10px 0 4px; color:var(--muted); font-weight:600; }
  /* Bauteilbaum */
  #tree { font-size:12.5px; user-select:none; }
  .node { display:flex; align-items:center; gap:5px; padding:2px 4px; border-radius:4px; cursor:default; }
  .node:hover { background:#22303f; }
  .node.hov { background:#3a3320; outline:1px solid var(--hover); }
  .node.sel { background:#16384a; outline:1px solid var(--sel); }
  .node .chev { width:12px; text-align:center; color:var(--muted); cursor:pointer; flex:none; }
  .node .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .node .cnt { color:var(--muted); font-variant-numeric:tabular-nums; flex:none; }
  .node input { margin:0; flex:none; }
  .lvl1 { margin-left:14px; } .lvl2 { margin-left:28px; }
  .cat > .node { font-weight:600; }
  .kids { display:none; } .open > .kids { display:block; }
  #sel { min-height:18px; color:var(--sel); font-size:12px; margin:4px 0; }
  #infopanel { position:fixed; top:10px; right:10px; width:410px; max-height:calc(100% - 20px); overflow:auto; background:var(--panel);
               border:1px solid var(--line); border-radius:8px; padding:12px 14px; font-size:12.5px; line-height:1.5; z-index:5; }
  #info h3 { margin:0 0 2px; font-size:15px; color:var(--text); }
  #info .sub { color:var(--muted); margin-bottom:6px; }
  #info .badges { display:flex; flex-wrap:wrap; gap:5px; margin:4px 0 8px; }
  #info .badge { background:#223142; border:1px solid var(--line); border-radius:10px; padding:1px 8px; font-size:11.5px; color:var(--text); }
  #info .badge.cnt { background:#1b3a2d; border-color:#2f6b4f; color:#9be0bf; }
  #info .k { color:var(--accent); font-weight:600; margin:9px 0 3px; font-size:12px; text-transform:uppercase; letter-spacing:.03em; }
  #info ol, #info ul { margin:2px 0 0; padding-left:18px; } #info li { margin:1px 0; }
  #info .g { color:var(--muted); font-weight:600; margin-top:4px; }
  #info table.kv { width:100%; border-collapse:collapse; } #info .kv td { padding:2px 4px; border-bottom:1px solid #1f2c39; vertical-align:top; }
  #info .kv td:first-child { color:var(--muted); width:42%; }
  #info .note { background:#2a2616; border-left:3px solid #d9c35b; padding:5px 8px; margin-top:8px; color:#e8d98a; }
  #info .src { color:var(--muted); font-size:11px; margin-top:8px; }
  #info .ph { color:var(--muted); }
  #fpvx { position:fixed; top:10px; right:10px; z-index:20; display:none; font-size:16px; padding:6px 14px; }
  body.fpv #panel, body.fpv #infopanel { display:none; } body.fpv #fpvx { display:block; }
</style>
<script type="importmap">
{ "imports": { "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="view"></div>
<button id="fpvx" title="FPV beenden (Esc)">X</button>
<div id="infopanel"><div id="info"></div></div>
<div id="panel">
  <h1>Kuppel Live-Viewer</h1>
  <div id="status">verbinde ...</div>
  <div class="row">
    <button data-cam="iso">Ansicht ref-4</button><button data-cam="top">Oben</button>
    <button data-cam="side">Seite</button><button data-cam="pool">Pool</button><button id="fpv">FPV</button> <a href="/history/" target="_blank" style="color:inherit">Bildverlauf</a>
  </div>
  <label class="opt"><input type="checkbox" id="wire"> Drahtgitter</label>
  <label class="opt"><input type="checkbox" id="auto" checked> Auto-Update</label>
  <h2>Schnitt (Hoehe)</h2>
  <input type="range" id="clip" min="0" max="7000" value="7000">
  <h2>Bauteile (Hover leuchtet, Klick waehlt)</h2>
  <div class="row"><button id="expandAll">Alle auf</button><button id="collapseAll">Alle zu</button><button id="showAll">Alle zeigen</button><button id="clearSel">Auswahl weg</button></div>
  <div id="sel"></div>
  <div id="tree"></div>
  <div id="perf" style="color:var(--muted);font-size:11px;margin-top:6px"></div>
  <h2>Bauteil-Stand (Board)</h2>
  <div id="board" style="font-size:12px"></div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.localClippingEnabled = true;
view.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f1720);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 100, 400000);
camera.up.set(0, 0, 1);                       // Z ist oben, Masse in mm
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.3));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(-8000, -12000, 16000); scene.add(sun);

const CAMS = {
  iso:  { pos: [0, -19000, 11000], target: [0, 0, 2200] },
  top:  { pos: [0, -1, 26000],      target: [0, 0, 0] },
  side: { pos: [0, -26000, 3200],   target: [0, 0, 3000] },
  pool: { pos: [3500, -5500, 3200], target: [0, 0, 300] },
};
function setCam(k) { const c = CAMS[k]; camera.position.set(...c.pos); controls.target.set(...c.target); controls.update(); }
setCam('iso');

const clipPlane = new THREE.Plane(new THREE.Vector3(0, 0, -1), 7000);
const mats = new Map();
function matFor(color, opacity) {
  const key = color + '|' + opacity;
  if (!mats.has(key)) mats.set(key, new THREE.MeshStandardMaterial({
    color, flatShading: true, side: THREE.DoubleSide, roughness: 0.65, metalness: 0.1,
    transparent: opacity < 1, opacity, clippingPlanes: [clipPlane], depthWrite: opacity >= 1 }));
  return mats.get(key);
}
// Leucht-Materialien: zeichnen ueber allem (depthTest aus), schimmern also durch andere Koerper
const hlMat = { hover: null, sel: null };
for (const [k, col] of [['hover', 0xffc247], ['sel', 0x4de1ff]]) {
  hlMat[k] = new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.7, depthTest: false, depthWrite: false, side: THREE.DoubleSide, clippingPlanes: [clipPlane] });
}

let model = null, extras = {}, version = -1;
const loader = new OBJLoader();
const defCache = new Map();                                 // Definitionsname -> Text: unveraenderte Definitionen werden nicht neu geladen
const hlGroup = new THREE.Group(); hlGroup.renderOrder = 999; scene.add(hlGroup);

// ---- Bauteilbaum: Kategorie -> Gruppe -> Einzelteil -----------------------------------------------------------
const CATS = [
  ['Kuppel-Struktur', /^(strebe|knoten|fundamentanker|fundamentring)/],
  ['Beete (Substrat)', /^ibc_beet/],
  ['NFT-Systeme', /^(nft_|winkelhalter)/],
  ['Tanks und Pumpen', /^(tank_|pumpe)/],
  ['Rohre und Schlaeuche', /^(lt_|zulaufrohr|rohr|schlauch)/],
  ['Pflanzen', /^(netztopf|salatkopf)/],
  ['Becken und Gelaende', /^(pool|zweitbecken|erdflaeche)/],
  ['Tuer', /^tuer/],
  ['Technik', /^schaltschrank/],
];
const catOf = stem => (CATS.find(c => c[1].test(stem)) || ['Sonstiges'])[0];
const leafKeyOf = stem => stem.replace(/_(n|r|t)\d+$/, '');   // Varianten (knoten_4_n17, nft_rinne_x_r3) zu einer Gruppe
const pretty = s => s.replace(/_/g, ' ').replace(/^\w/, c => c.toUpperCase());
const DEFCOL = [[/^tank_/, '#93b49a'], [/^pumpe_/, '#2a5da8'], [/^ibc_beet/, '#c9ccc4'], [/^nft_tisch/, '#9aa6b2'], [/^strebe/, '#b9c0c8']];
const baseName = n => n.replace(/ \(.*$/, '');            // Koerpernamen: "T1_Strebe_A", "Wanne (2)"
function colorFor(name, def) {
  const base = baseName(name);
  const c = extras.colors && (extras.colors[base] || extras.colors[Object.keys(extras.colors).find(k => k.replace(/_\d+$/, '') === base.replace(/_\d+$/, ''))]);
  if (c) return matFor(c[0], c[1]);
  const P = [[/^T5_Wasser|^T6_Wasser/, '#3c8ed0', 0.85], [/^T13_/, '#8a6f4d', 1], [/^T1_/, '#b9c0c8', 1], [/^T3_/, '#cfcfca', 1],
             [/^T4_/, '#1c1c1c', 1], [/^T5_|^T6_|^T7_/, '#93b49a', 1], [/^T8_/, '#f3f3f1', 1], [/^T9_/, '#ffffff', 1],
             [/^T10_/, '#5fa8e0', 1], [/^T11_/, '#8b9096', 1], [/^T12_/, '#4c9a3c', 1]];
  const hit = P.find(p => p[0].test(base));
  if (hit) return matFor(hit[1], hit[2]);
  const d = DEFCOL.find(p => p[0].test(def));
  if (/Wasser|Medium/.test(base)) return matFor(/Wasser/.test(base) ? '#3c8ed0' : '#8a6f4d', /Wasser/.test(base) ? 0.85 : 1);
  return matFor(d ? d[1] : '#b0b8c0', 1);
}

// Zustand, der Neuladen ueberlebt
const hiddenLeaf = new Set(), hiddenInst = new Set(), openNodes = new Set(['cat:NFT-Systeme']);
let selected = null;                                        // { stem, idx }
let hover = null;                                           // Liste [{stem, idx}] oder null
// Modellindex (bei jedem load neu)
let defMeshes = {}, defMats = {}, defList = {}, defCol = {}, leaves = new Map(), cats = new Map(), stemLeaf = {};

const zero = new THREE.Matrix4().makeScale(0, 0, 0);
function applyInstVisibility(stem, idx) {
  const hide = hiddenInst.has(stem + '#' + idx) || hiddenLeaf.has(stemLeaf[stem]);
  defMeshes[stem].forEach(im => { im.setMatrixAt(idx, hide ? zero : defMats[stem][idx]); im.instanceMatrix.needsUpdate = true; });
}
function setLeafVisible(key, on) {
  on ? hiddenLeaf.delete(key) : hiddenLeaf.add(key);
  leaves.get(key).stems.forEach(stem => defMeshes[stem].forEach(im => { im.visible = on; }));
}
function itemsOf(kind, key) {                               // alle {stem, idx} einer Kategorie / Gruppe
  const out = [];
  const stems = kind === 'cat' ? cats.get(key).leaves.flatMap(l => leaves.get(l).stems) : leaves.get(key).stems;
  stems.forEach(s => defList[s].forEach((_, i) => { if (!hiddenInst.has(s + '#' + i)) out.push({ stem: s, idx: i }); }));
  return out;
}

// ---- Leuchten (Hover = gelb, Auswahl = cyan), auch durch andere Koerper sichtbar ---------------------------------
function rebuildHighlight() {
  hlGroup.children.slice().forEach(o => { hlGroup.remove(o); o.dispose && o.dispose(); });
  const add = (items, mat) => {
    if (!items || !items.length) return;
    const by = {}; items.forEach(it => (by[it.stem] || (by[it.stem] = [])).push(it.idx));
    for (const [stem, idxs] of Object.entries(by)) {
      if (!defMeshes[stem] || !defMeshes[stem][0].visible) continue;
      defMeshes[stem].forEach(base => {
        const im = new THREE.InstancedMesh(base.geometry, mat, idxs.length);
        idxs.forEach((ix, j) => im.setMatrixAt(j, defMats[stem][ix]));
        im.frustumCulled = false; im.renderOrder = 999; im.raycast = () => {}; hlGroup.add(im);
      });
    }
  };
  add(selected ? [selected] : null, hlMat.sel);
  add(hover, hlMat.hover);
}
let hoverT = null, pinned = null;
function setHover(items, node, o) {                          // entprellt: kein Flackern beim Ueberfahren der Liste
  clearTimeout(hoverT);
  hoverT = setTimeout(() => {
    hover = items; document.querySelectorAll('.node.hov').forEach(n => n.classList.remove('hov')); if (node) node.classList.add('hov');
    rebuildHighlight();
    showInfo(node && o ? o : (selected ? { kind: 'inst', stem: selected.stem, idx: selected.idx } : pinned));
  }, node ? 60 : 160);
}

// ---- Beschreibungen (data/descriptions.json) --------------------------------------------------------------------
let DESC = { kategorien: {}, bauteile: [] };
fetch('/descriptions.json?v=' + Date.now()).then(r => r.json()).then(d => { DESC = d; }).catch(() => {});
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
function descOf(stem) { return DESC.bauteile.find(b => new RegExp(b.match).test(stem)); }
const steps = a => `<ol>${a.map(x => `<li>${esc(x)}</li>`).join('')}</ol>`;
const bullets = a => `<ul>${a.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
const grouped = a => a.map(g => typeof g === 'string' ? bullets([g]) : `<div class="g">${esc(g.t)}</div>${bullets(g.p)}`).join('');
const kv = o => `<table class="kv">${Object.entries(o).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('')}</table>`;
let SPEC = null;
fetch('/system-specs.json?v=' + Date.now()).then(r => r.json()).then(d => { SPEC = d; if (!pinned && !selected) showInfo(null); }).catch(() => {});
const fm = (x, n = 1) => Number(x).toLocaleString('de-DE', { maximumFractionDigits: n });
const has = x => x !== undefined && x !== null;
const kvx = o => kv(Object.fromEntries(Object.entries(o).filter(([, v]) => v)));   // Zeilen ohne Wert (fehlender Schluessel) entfallen
const rng = (a, u, n = 1) => Array.isArray(a) ? fm(a[0], n) + '–' + fm(a[a.length - 1], n) + ' ' + u : '';
function overview() {
  if (!SPEC) return '<span class="ph">Kuppel-Kennzahlen werden geladen ...</span>';
  const w = SPEC.wasser || {}, pf = SPEC.pflanzen || {}, f = SPEC.fische || {}, fl = SPEC.fluesse || {}, l = SPEC.leistung || {}, fi = SPEC.filter || {}, k = SPEC.kapazitaet || {};
  const h = SPEC.huelle || {}, hz = l.heizung || {}, fb = f.tabelle_ben || {}, sp = f.spanne || {};
  const wt = {}; (w.teile || []).forEach(t => { wt[t[0]] = fm(t[1]) + ' m³ (' + t[2] + ')'; });
  const chk = (SPEC.konsistenz || []).map(c => `<li>${c.ok ? '✔ OK' : '⚠ Warnung'} – <b>${esc(c.pruefung)}</b><div class="sub">${esc(c.detail)}</div></li>`).join('');
  const tab = (v, u, n = 0) => has(v) ? ' (Ben: ' + fm(v, n) + ' ' + u + ')' : '';
  const sec = (titel, o) => Object.values(o).some(Boolean) ? `<div class="k">${titel}</div>${kvx(o)}` : '';
  return `<h3>Kuppel auf einen Blick</h3><div class="sub">12 m Durchmesser, 2V-Halbkugel, 6 m hoch.${has(SPEC.stand) ? ' Stand ' + esc(SPEC.stand) + '.' : ''}</div>`
  + sec('Wasser im System', has(w.gesamt_m3) ? { 'Gesamt': fm(w.gesamt_m3) + ' m³' + tab(w.tabelle_systemwasser_m3, 'm³'), ...wt, 'Davon im Kreislauf': has(w.im_kreislauf_m3) ? fm(w.im_kreislauf_m3) + ' m³' : '', 'Fischwasser': has(w.fischwasser_m3) ? fm(w.fischwasser_m3) + ' m³' : '' } : {})
  + sec('Pflanzen', has(pf.gesamt) ? { 'Töpfe gesamt': fm(pf.gesamt, 0) + ' (Ben: mind. ' + fm(pf.tabelle, 0) + ')', 'Beete / NFT': has(pf.beete) ? fm(pf.beete, 0) + ' / ' + fm(pf.nft, 0) : '', 'NFT-Rinnen': has(pf.rinnen) ? pf.rinnen + ' Rinnen, ' + fm(pf.rinnenlaenge_m, 0) + ' m' : '', 'Pflanzfläche': has(pf.flaeche_gesamt_m2) ? fm(pf.flaeche_gesamt_m2) + ' m²' : '', 'Substrat': has(pf.substrat_m3) ? fm(pf.substrat_m3) + ' m³' : '' } : {})
  + sec('Fische und Futter (Auslegung D40)', has(f.biomasse_kg) ? { 'Biomasse': fm(f.biomasse_kg, 0) + ' kg' + (sp.biomasse_kg ? ' (Spanne ' + rng(sp.biomasse_kg, 'kg', 0) + ')' : '') + tab(fb.biomasse_kg, 'kg'), 'Futter': fm(f.futter_kg_tag) + ' kg/Tag' + tab(fb.futter_kg_tag, 'kg/Tag', 1), 'Fischzahl': has(f.anzahl) ? fm(f.anzahl, 0) + ' Tilapia' + tab(fb.anzahl, 'Fische') : '', 'Dichte': has(f.dichte_kg_m3) ? fm(f.dichte_kg_m3, 0) + ' kg/m³' + tab(fb.dichte_kg_m3, 'kg/m³') : '', 'Ammonium (TAN)': has(f.tan_g_tag) ? '≈ ' + fm(f.tan_g_tag, 0) + ' g/Tag' + tab(fb.tan_g_tag, 'g/Tag') : '', 'Obergrenze FAO': has(f.obergrenze_fao_kg) ? fm(f.obergrenze_fao_kg, 0) + ' kg' : '' } : {})
  + sec('Hülle und Heizung', has(h.flaeche_m2) || has(hz.huelle_m2) ? { 'Hülle': h.material ? 'Plane, PE doppelt luftgepolstert' : '', 'Fläche': fm(h.flaeche_m2 || hz.huelle_m2, 0) + ' m²', 'Wärmeverlust': rng(hz.w_je_k, 'W/K', 0) && (rng(hz.w_je_k, 'W/K', 0) + (hz.w_je_k.length > 2 ? ' (Mitte ' + fm(hz.w_je_k[1], 0) + ')' : '')), ['Spitze bei ' + (hz.dT_k || '?') + ' K']: has(hz.beispiel_dT30_kw) ? rng(hz.beispiel_dT30_kw, 'kW') + (hz.beispiel_dT30_kw.length > 2 ? ' (Mitte ' + fm(hz.beispiel_dT30_kw[1]) + ')' : '') : '', 'Jahr (Obergrenze)': rng(hz.jahr_obergrenze_mwh, 'MWh', 0), 'Gebläse Luftpolster': has(l.geblaese_luftpolster_w) ? fm(l.geblaese_luftpolster_w, 0) + ' W' : '', 'Standort': h.standort ? h.standort : '' } : {})
  + sec('Kreislauf und Pumpen', has(fl.kreislauf_l_min) ? { 'Bedarf Pflanzen': fl.kreislauf_l_min + ' l/min = ' + fm(fl.kreislauf_m3_h) + ' m³/h (NFT ' + fl.nft_l_min + ' + Beete ' + fl.beete_l_min + ')', 'Hauptkreislauf': has(fl.hauptkreislauf_l_min) ? fl.hauptkreislauf_l_min + ' l/min (' + (fl.hauptkreislauf_pumpen || '') + ')' : '', 'Umwälzzeit': has(fl.umwaelzzeit_h) ? '≈ ' + fm(fl.umwaelzzeit_h) + ' h' : '' } : {})
  + sec('Strom (ohne Heizung)', has(l.gesamt_w) ? { 'Pumpen': has(l.pumpe_elektrisch_w) ? '2 × ' + l.pumpe_elektrisch_w + ' W' : '', 'Belüftung': has(l.belueftung_w) ? l.belueftung_w + ' W' : '', 'Steuerung': has(l.steuerung_w) ? l.steuerung_w + ' W' : '', 'Summe': l.gesamt_w + ' W = ' + fm(l.kwh_tag) + ' kWh/Tag = ' + l.kwh_monat + ' kWh/Monat' } : {})
  + sec('Filter', has(fi.absetzer_klein_l) ? { 'Absetzer klein': fi.absetzer_klein_l + ' l, ' + fm(fi.verweilzeit_absetzer_min, 0) + ' min Verweilzeit', 'Biofilter groß': has(fi.biofilter_gross_l) ? fi.biofilter_gross_l + ' l, Medium ' + fi.medium_biofilter_m3 + ' m³' : '', 'Pflanzen tragen': has(k.pflanzen_kg_futter_tag) ? fm(k.pflanzen_kg_futter_tag) + ' kg Futter/Tag' : '' } : {})
  + sec('Puffer (2 IBC gestapelt)', has(SPEC.puffer) ? { 'Volumen': has(SPEC.puffer.volumen_m3) ? fm(SPEC.puffer.volumen_m3) + ' m³ (' + (SPEC.puffer.anteil_wasser || '') + ' des Wassers)' : '', 'Wasserverlust': has(SPEC.puffer.wasserverlust_m3_tag) ? fm(SPEC.puffer.wasserverlust_m3_tag, 2) + ' m³/Tag, Puffer reicht ' + fm(SPEC.puffer.deckt_wasserverlust_tage) + ' Tage' : '', 'Strom': has((SPEC.puffer.strom_w || {}).summe) ? fm(SPEC.puffer.strom_w.summe) + ' W' : '', 'Rollen': (SPEC.puffer.rollen || []).join('; ') } : {})
  + sec('Drittbecken (Quarantäne)', has(SPEC.drittbecken) ? { 'Maß': has(SPEC.drittbecken.volumen_m3) ? fm(SPEC.drittbecken.durchmesser_m, 2) + ' × ' + fm(SPEC.drittbecken.tiefe_m, 2) + ' m = ' + fm(SPEC.drittbecken.volumen_m3, 2) + ' m³ (Maß offen, D46)' : '', 'Besatz': has((SPEC.drittbecken.besatz_uvi || {}).kg) ? SPEC.drittbecken.besatz_uvi.fische + ' Fische, ' + fm(SPEC.drittbecken.besatz_uvi.kg) + ' kg (max. ' + fm(SPEC.drittbecken.besatz_uvi.fao_max_kg) + ' kg)' : '', 'Futter': has(SPEC.drittbecken.futter_g_tag) ? fm(SPEC.drittbecken.futter_g_tag, 0) + ' g/Tag' : '', 'Nötig': SPEC.drittbecken.noetig || '' } : {})
  + sec('Pflanzmix (Empfehlung)', has(SPEC.pflanzmix) ? { 'Beete': (SPEC.pflanzmix.beete || []).map(b => b.art + ' ' + b.pflanzen).join(', '), 'NFT': (SPEC.pflanzmix.nft || []).map(b => b.art.split(' (')[0] + ' ' + b.toepfe).join(', '), 'Bepflanzt': has((SPEC.pflanzmix.topfplaetze || {}).bepflanzt) ? fm(SPEC.pflanzmix.topfplaetze.bepflanzt, 0) + ' von ' + fm(SPEC.pflanzmix.topfplaetze.gesamt, 0) + ' Töpfen' : '', 'Futter-Ziel': rng(SPEC.pflanzmix.ziel_futter_kg_tag, 'kg/Tag'), 'Rückfall (Fisch)': rng(SPEC.pflanzmix.rueckfall_fisch_kg, 'kg', 0), 'Empfehlung': (SPEC.pflanzmix.empfehlung || {}).szenario ? SPEC.pflanzmix.empfehlung.szenario + ': ' + fm(SPEC.pflanzmix.empfehlung.futter_kg_tag, 2) + ' kg Futter, ' + fm(SPEC.pflanzmix.empfehlung.fisch_kg, 0) + ' kg Fisch' : '' } : {})
  + sec('Außenrinnen-Szenario', has(SPEC.szenario) ? Object.fromEntries([['drei_rinnen', '3 Rinnen'], ['vier_rinnen', '4 Rinnen' + (SPEC.szenario.aussen_rinnen === 4 ? ' (Standard)' : '')]].filter(([key]) => SPEC.szenario[key]).map(([key, t]) => { const s = SPEC.szenario[key]; return [t, fm(s.flaeche_gesamt_m2) + ' m², ' + s.nft_topf + ' NFT-Töpfe, nötig ' + fm(s.noetiger_fruchtanteil * 100, 0) + ' % Frucht; Bens Mix trägt ' + s.tragbar_bens_mix_kg + ' kg']; })) : {})
  + sec('Sauerstoff', has((SPEC.sauerstoff || {}).gesamt_kg_tag) ? { 'Bedarf': rng(SPEC.sauerstoff.gesamt_kg_tag, 'kg/Tag') + ' (Spitze ×' + fm(SPEC.sauerstoff.spitze_faktor) + ')', 'Belüftung nötig': has(SPEC.sauerstoff.belueftung_aus_bedarf_w) ? fm(SPEC.sauerstoff.belueftung_aus_bedarf_w, 0) + ' W' : '' } : {})
  + ((SPEC.offene_fragen || []).length ? `<div class="k">Offene Fragen</div>${bullets(SPEC.offene_fragen)}` : '')
  + (chk ? `<div class="k">Passt das zusammen?</div><ul>${chk}</ul>` : '')
  + `<div class="note"><b>Hinweis:</b> ${esc(SPEC.hinweis || '')} Rechnung: scripts/system_specs.py.</div>`;
}
function showInfo(o) {
  const box = document.getElementById('info');
  if (!o) { box.innerHTML = overview() + '<div class="src">Zeige auf ein Bauteil in der Liste oder klicke es im Modell an: dann steht hier seine Beschreibung.</div>'; return; }
  if (o.kind === 'cat') { const C = cats.get(o.key); box.innerHTML = `<h3>${esc(o.key)}</h3><div class="badges"><span class="badge cnt">${C ? C.count : ''} Teile</span><span class="badge">${C ? C.leaves.length : ''} Gruppen</span></div><div>${esc(DESC.kategorien[o.key] || '')}</div>`; return; }
  const stem = o.kind === 'leaf' ? leaves.get(o.key).stems[0] : o.stem, d = descOf(stem);
  const cnt = o.kind === 'leaf' ? leaves.get(o.key).count + ' Stück' : (defList[o.stem] && o.idx !== undefined && defList[o.stem][o.idx] ? defList[o.stem][o.idx].n.replace(/_/g, ' ') : '');
  if (!d) { box.innerHTML = `<h3>${esc(stem)}</h3><span class="ph">Noch keine Beschreibung hinterlegt (data/descriptions.json).</span>`; return; }
  box.innerHTML = `<h3>${esc(d.titel)}</h3>` + (d.was ? `<div class="sub">${esc(d.was)}</div>` : '') +
    `<div class="badges">${cnt ? `<span class="badge cnt">${esc(cnt)}</span>` : ''}${d.status ? `<span class="badge">${esc(d.status)}</span>` : ''}</div>` +
    (d.ablauf ? `<div class="k">So funktioniert es</div>${steps(d.ablauf)}` : d.funktion ? `<div class="k">So funktioniert es</div><div>${esc(d.funktion)}</div>` : '') +
    (d.aufbau ? `<div class="k">Aufbau im Modell</div>${grouped(d.aufbau)}` : d.modelliert ? `<div class="k">Im Modell enthalten</div>${bullets(d.modelliert)}` : '') +
    (d.masse ? `<div class="k">Masse und Kennzahlen</div>${kv(d.masse)}` : d.kennzahlen ? `<div class="k">Kennzahlen</div>${bullets(d.kennzahlen)}` : '') +
    ((d.grenzen || d.hinweis) ? `<div class="note"><b>Annahmen und Grenzen:</b> ${esc(d.grenzen || d.hinweis)}</div>` : '') +
    (d.quelle ? `<div class="src">Quelle: ${esc(d.quelle)}</div>` : '');
}

// ---- Baum aufbauen ----------------------------------------------------------------------------------------------
function buildTree(inst) {
  leaves = new Map(); cats = new Map(); stemLeaf = {};
  Object.keys(defList).forEach(stem => {
    const lk = leafKeyOf(stem), ck = catOf(stem);
    if (!leaves.has(lk)) leaves.set(lk, { key: lk, cat: ck, stems: [], count: 0, label: pretty(inst.defs[stem].cls.replace(/_(n|r|t)\d+$/, '')) });
    const L = leaves.get(lk); L.stems.push(stem); L.count += defList[stem].length; stemLeaf[stem] = lk;
    if (!cats.has(ck)) cats.set(ck, { key: ck, leaves: [], count: 0 });
  });
  leaves.forEach(L => { const C = cats.get(L.cat); if (!C.leaves.includes(L.key)) C.leaves.push(L.key); C.count += L.count; });
  const box = document.getElementById('tree'), keep = document.getElementById('panel').scrollTop; box.innerHTML = '';
  const order = CATS.map(c => c[0]).concat('Sonstiges');
  [...cats.keys()].sort((a, b) => order.indexOf(a) - order.indexOf(b)).forEach(ck => {
    const C = cats.get(ck), el = document.createElement('div'); el.className = 'cat'; el.dataset.key = 'cat:' + ck;
    if (openNodes.has('cat:' + ck)) el.classList.add('open');
    el.appendChild(nodeRow({ kind: 'cat', key: ck, label: ck, count: C.count, color: null, chev: true }));
    const kids = document.createElement('div'); kids.className = 'kids';
    C.leaves.sort().forEach(lk => {
      const L = leaves.get(lk), le = document.createElement('div'); le.className = 'leaf lvl1'; le.dataset.key = 'leaf:' + lk;
      if (openNodes.has('leaf:' + lk)) le.classList.add('open');
      const many = L.count > 80;
      le.appendChild(nodeRow({ kind: 'leaf', key: lk, label: L.label, count: L.count, color: defCol[L.stems[0]], chev: !many }));
      if (!many) {
        const ik = document.createElement('div'); ik.className = 'kids';
        L.stems.forEach(stem => defList[stem].forEach((it, i) => ik.appendChild(nodeRow({ kind: 'inst', key: stem + '#' + i, stem, idx: i, label: it.n.replace(/_/g, ' '), count: '', color: null, chev: false }))));
        le.appendChild(ik);
      }
      kids.appendChild(le);
    });
    el.appendChild(kids); box.appendChild(el);
  });
  document.getElementById('panel').scrollTop = keep;
  refreshChecks(); markSelection();
}
function nodeRow(o) {
  const n = document.createElement('div'); n.className = 'node' + (o.kind === 'inst' ? ' lvl2' : ''); n.dataset.nk = o.kind + ':' + o.key;
  const on = o.kind === 'inst' ? !hiddenInst.has(o.key) : o.kind === 'leaf' ? !hiddenLeaf.has(o.key) : true;
  n.innerHTML = `<span class="chev">${o.chev ? '▸' : ''}</span><input type="checkbox" ${on ? 'checked' : ''}>` +
    (o.color ? `<span class="sw" style="background:${o.color}"></span>` : '') +
    `<span class="name" title="${o.label}">${o.label}</span><span class="cnt">${o.count === '' ? '' : '(' + o.count + ')'}</span>`;
  const items = () => o.kind === 'inst' ? [{ stem: o.stem, idx: o.idx }] : itemsOf(o.kind, o.key);
  n.addEventListener('mouseenter', () => setHover(items(), n, o));
  n.addEventListener('mouseleave', () => setHover(null, null, null));
  n.querySelector('.chev').addEventListener('click', e => {
    const p = n.parentElement; p.classList.toggle('open'); const id = p.dataset.key;
    p.classList.contains('open') ? openNodes.add(id) : openNodes.delete(id); e.stopPropagation();
  });
  n.querySelector('input').addEventListener('change', e => toggle(o, e.target.checked));
  n.addEventListener('click', e => {
    if (e.target.tagName === 'INPUT' || e.target.classList.contains('chev')) return;
    if (o.kind === 'inst') select({ stem: o.stem, idx: o.idx }, false); else { pinned = o; showInfo(o); }
  });
  return n;
}
function toggle(o, on) {
  if (o.kind === 'inst') { on ? hiddenInst.delete(o.key) : hiddenInst.add(o.key); applyInstVisibility(o.stem, o.idx); }
  else if (o.kind === 'leaf') setLeafVisible(o.key, on);
  else cats.get(o.key).leaves.forEach(lk => setLeafVisible(lk, on));
  refreshChecks(); rebuildHighlight();
}
function refreshChecks() {                                   // Haken und Teil-Zustand der Eltern nachziehen
  document.querySelectorAll('#tree .leaf > .node').forEach(n => { const k = n.dataset.nk.slice(5); n.querySelector('input').checked = !hiddenLeaf.has(k); n.querySelector('input').indeterminate = false; });
  document.querySelectorAll('#tree .cat').forEach(c => {
    const ck = c.dataset.key.slice(4), ls = cats.get(ck).leaves, off = ls.filter(l => hiddenLeaf.has(l)).length, inp = c.querySelector(':scope > .node input');
    inp.checked = off < ls.length; inp.indeterminate = off > 0 && off < ls.length;
  });
}

// ---- Auswahl durch Klick im Modell oder in der Liste ---------------------------------------------------------------
function markSelection() {
  document.querySelectorAll('.node.sel').forEach(n => n.classList.remove('sel'));
  const sl = document.getElementById('sel');
  if (!selected || !defList[selected.stem]) { sl.textContent = ''; return; }
  const it = defList[selected.stem][selected.idx], lk = stemLeaf[selected.stem], L = leaves.get(lk);
  sl.textContent = `Auswahl: ${it.n.replace(/_/g, ' ')} — ${L.label} (${L.cat})`;
  const find = nk => document.querySelector(`[data-nk="${nk}"]`);
  let row = find('inst:' + selected.stem + '#' + selected.idx);
  [`leaf:${lk}`, `cat:${L.cat}`].forEach(id => { const p = document.querySelector(`[data-key="${id}"]`); if (p) { p.classList.add('open'); openNodes.add(id); } });
  row = row || find('leaf:' + lk);
  if (row) { row.classList.add('sel'); row.scrollIntoView({ block: 'nearest' }); }
}
function select(s, fromModel) { selected = s; markSelection(); rebuildHighlight(); showInfo(s ? { kind: 'inst', stem: s.stem, idx: s.idx } : pinned); }
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); let down = null;
renderer.domElement.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (fpv.on || !down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5 || !model) return;
  ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(model.children.filter(o => o.visible), false)[0];
  if (hit && hit.instanceId !== undefined) select({ stem: hit.object.userData.def, idx: hit.instanceId }, true); else select(null, true);
});
document.getElementById('clearSel').addEventListener('click', () => select(null));
document.getElementById('showAll').addEventListener('click', () => { hiddenInst.clear(); [...leaves.keys()].forEach(k => setLeafVisible(k, true)); defList && Object.keys(defList).forEach(s => defList[s].forEach((_, i) => applyInstVisibility(s, i))); document.querySelectorAll('#tree input').forEach(i => { i.checked = true; i.indeterminate = false; }); rebuildHighlight(); });
document.getElementById('expandAll').addEventListener('click', () => document.querySelectorAll('#tree .cat, #tree .leaf').forEach(p => { p.classList.add('open'); openNodes.add(p.dataset.key); }));
document.getElementById('collapseAll').addEventListener('click', () => document.querySelectorAll('#tree .cat, #tree .leaf').forEach(p => { p.classList.remove('open'); openNodes.delete(p.dataset.key); }));

// ---- Laden ----------------------------------------------------------------------------------------------------------
async function load() {
  const v = Date.now();
  const [inst, ex] = await Promise.all([fetch('instances.json?v=' + v).then(r => r.json()), fetch('extras.json?v=' + v).then(r => r.json())]);
  extras = ex;
  const m = new THREE.Group(); const t0 = performance.now();
  await Promise.all(Object.entries(inst.defs).map(async ([stem, d]) => {
    const key = stem + '|' + d.kb;                          // Groesse als Versionsmerkmal der Definition
    if (!defCache.has(key)) defCache.set(key, await fetch(`defs/${stem}.obj?k=${d.kb}`).then(r => r.text()));
  }));
  const byDef = {}; inst.instances.forEach(i => (byDef[i.d] || (byDef[i.d] = [])).push(i));
  defMeshes = {}; defMats = {}; defList = {}; defCol = {};
  for (const [stem, list] of Object.entries(byDef)) {
    const g = loader.parse(defCache.get(stem + '|' + inst.defs[stem].kb));
    const mxs = list.map(i => new THREE.Matrix4().set(...i.m, 0, 0, 0, 1));
    defMats[stem] = mxs; defList[stem] = list; defMeshes[stem] = [];
    g.traverse(o => {
      if (!o.isMesh) return;
      const name = o.name || o.parent.name, mat = colorFor(name, stem);
      const im = new THREE.InstancedMesh(o.geometry, mat, list.length);
      mxs.forEach((mx, i) => im.setMatrixAt(i, mx));
      im.frustumCulled = false; im.name = name; im.userData.def = stem; m.add(im); defMeshes[stem].push(im);
      if (!defCol[stem]) defCol[stem] = '#' + mat.color.getHexString();
    });
  }
  if (model) { scene.remove(model); model.traverse(o => o.geometry && !o.isInstancedMesh && o.geometry.dispose()); }
  model = m; scene.add(model);
  Object.keys(defList).forEach(stem => { if (hiddenLeaf.has(leafKeyOf(stem))) defMeshes[stem].forEach(im => { im.visible = false; }); });
  hiddenInst.forEach(k => { const [s, i] = k.split('#'); if (defMeshes[s]) applyInstVisibility(s, +i); });
  if (selected && !defList[selected.stem]) selected = null;
  document.getElementById('perf').textContent = `${inst.instances.length} Instanzen, ${Object.keys(inst.defs).length} Definitionen, ${(Object.values(inst.defs).reduce((s, d) => s + d.kb, 0) / 1024).toFixed(1)} MB, Aufbau ${((performance.now() - t0) / 1000).toFixed(1)} s, Kleinteile < ${inst.min_diag} mm ausgeblendet`;
  buildTree(inst); applyWire(); rebuildHighlight(); if (!pinned && !selected) showInfo(null);
}
function applyWire() { const w = document.getElementById('wire').checked; mats.forEach(m => m.wireframe = w); }
document.getElementById('wire').addEventListener('change', applyWire);
document.getElementById('clip').addEventListener('input', e => { clipPlane.constant = +e.target.value; });
document.querySelectorAll('[data-cam]').forEach(b => b.addEventListener('click', () => setCam(b.dataset.cam)));

async function poll() {
  const st = document.getElementById('status');
  try {
    const s = await fetch('/api/state?t=' + Date.now()).then(r => r.json());
    const auto = document.getElementById('auto').checked;
    st.innerHTML = `Modell gespeichert <b>${s.design_saved || '-'}</b> · Viewer <b>${s.built || '-'}</b>` +
      (s.busy ? ' · <b>exportiert ...</b>' : '') + (s.error ? '<br>Fehler: ' + s.error.replace(/</g, '&lt;') : '') +
      (extras.bodies ? `<br>${extras.bodies} Instanzen` : '');
    if (auto && !(window.fpvState && window.fpvState().on) && s.version !== version && s.version > 0) { version = s.version; await load(); }
  } catch (e) { st.textContent = 'Server nicht erreichbar'; }
}
async function pollBoard() {
  try {
    const rows = await fetch('/api/board?t=' + Date.now()).then(r => r.json());
    const col = s => /eingebaut/.test(s) ? '#4cc38a' : /abgenommen/.test(s) ? '#7fd3a8' : /L3|L4/.test(s) ? '#d9c35b' : /Arbeit|L2/.test(s) ? '#e0954a' : '#7a8896';
    document.getElementById('board').innerHTML = rows.map(r =>
      `<div style="display:flex;gap:6px;align-items:baseline;padding:1px 0"><span class="sw" style="background:${col(r.status)}"></span>` +
      `<span style="flex:1">${r.klasse.replace(/</g, '&lt;')} <span style="color:var(--muted)">(${r.n}, ${r.wer})</span></span></div>` +
      `<div style="color:var(--muted);margin:0 0 3px 16px">${r.status.replace(/</g, '&lt;')}</div>`).join('');
  } catch (e) {}
}
setInterval(poll, 2000); poll(); setInterval(pollBoard, 5000); pollBoard();
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// ---- FPV: in Augenhoehe 1,68 m durch die Kuppel gehen (Masse in mm) -------------------------------------------------
const GROUND = 0, EYE = 1680, WALK = 1400, TURN = 1.6;      // Boden-Z, Augenhoehe, mm/s, rad/s
const fpv = { on: false, x: 0, y: 0, yaw: 0, pitch: 0, keys: new Set(), saved: null, last: 0, drag: false };
function fpvStart() {
  const door = model && defList.tuer_komplett && defList.tuer_komplett[0];
  const d = door ? Math.hypot(door.m[3], door.m[7]) || 1 : 1, dx = door ? door.m[3] / d : 0, dy = door ? door.m[7] / d : -1;
  fpv.x = dx * 8000; fpv.y = dy * 8000; fpv.yaw = Math.atan2(-dy, -dx); fpv.pitch = 0;   // 8 m vom Mittelpunkt, Blick zur Tuer
}
function fpvEnter() {
  if (fpv.on) return;
  fpv.saved = { pos: camera.position.clone(), target: controls.target.clone(), fov: camera.fov, near: camera.near, clip: clipPlane.constant, up: camera.up.clone() };
  fpvStart(); fpv.on = true; fpv.keys.clear(); fpv.last = 0;
  document.body.classList.add('fpv'); controls.enabled = false; hlGroup.visible = false;
  clipPlane.constant = 100000;
  camera.fov = 75; camera.near = 50; camera.updateProjectionMatrix();
  fpvApply();
}
function fpvExit() {
  if (!fpv.on) return;
  fpv.on = false; fpv.keys.clear(); fpv.drag = false;
  if (document.pointerLockElement) document.exitPointerLock();
  const sv = fpv.saved;
  document.body.classList.remove('fpv'); controls.enabled = true; hlGroup.visible = true;
  clipPlane.constant = sv.clip; camera.fov = sv.fov; camera.near = sv.near; camera.up.copy(sv.up); camera.updateProjectionMatrix();
  camera.position.copy(sv.pos); controls.target.copy(sv.target); controls.update();
}
function fpvApply() {
  camera.position.set(fpv.x, fpv.y, GROUND + EYE);
  const cp = Math.cos(fpv.pitch);
  camera.lookAt(fpv.x + Math.cos(fpv.yaw) * cp, fpv.y + Math.sin(fpv.yaw) * cp, GROUND + EYE + Math.sin(fpv.pitch));
}
function fpvStep(t) {
  const dt = fpv.last ? Math.min((t - fpv.last) / 1000, 0.1) : 0; fpv.last = t;
  const k = c => fpv.keys.has(c), sp = WALK * dt * (k('ShiftLeft') || k('ShiftRight') ? 3 : 1);
  const fw = (k('KeyW') || k('ArrowUp') ? 1 : 0) - (k('KeyS') || k('ArrowDown') ? 1 : 0), st = (k('KeyD') ? 1 : 0) - (k('KeyA') ? 1 : 0);
  fpv.yaw += ((k('ArrowLeft') || k('KeyQ') ? 1 : 0) - (k('ArrowRight') || k('KeyE') ? 1 : 0)) * TURN * dt;
  fpv.x += (Math.cos(fpv.yaw) * fw + Math.sin(fpv.yaw) * st) * sp;
  fpv.y += (Math.sin(fpv.yaw) * fw - Math.cos(fpv.yaw) * st) * sp;
  fpvApply();
}
function fpvLook(dx, dy) {
  fpv.yaw -= dx * 0.0025; fpv.pitch = Math.max(-1.396, Math.min(1.396, fpv.pitch - dy * 0.0025));   // +-80 Grad
}
document.getElementById('fpv').addEventListener('click', fpvEnter);
document.getElementById('fpvx').addEventListener('click', fpvExit);
addEventListener('keydown', e => {
  if (!fpv.on) return;
  if (e.code === 'Escape') { fpvExit(); return; }
  fpv.keys.add(e.code); if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
}, true);
addEventListener('keyup', e => fpv.keys.delete(e.code), true);
addEventListener('blur', () => fpv.keys.clear());
renderer.domElement.addEventListener('pointerdown', e => { if (!fpv.on) return; fpv.drag = true; try { renderer.domElement.requestPointerLock && renderer.domElement.requestPointerLock(); } catch (_) {} });
addEventListener('pointerup', () => { fpv.drag = false; });
addEventListener('pointermove', e => { if (fpv.on && (document.pointerLockElement || fpv.drag)) fpvLook(e.movementX || 0, e.movementY || 0); });
window.fpvState = () => ({ on: fpv.on, x: fpv.x, y: fpv.y, z: camera.position.z, yaw: fpv.yaw, pitch: fpv.pitch });
(function loop(t) {
  const p = 0.45 + 0.25 * Math.sin(t / 220); hlMat.hover.opacity = p; hlMat.sel.opacity = 0.35 + 0.25 * Math.sin(t / 300 + 1);
  if (fpv.on) fpvStep(t); else controls.update();
  renderer.render(scene, camera); requestAnimationFrame(loop);
})(0);
</script>
